<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誕生日占い | コスモ博士の星の共鳴理論</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }
    /* Stars background */
    #stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 2s) infinite alternate;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      from { opacity: 0.15; transform: scale(1); }
      to { opacity: 0.9; transform: scale(1.4); }
    }
    /* Layout */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 40px;
      min-height: 100vh;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    /* Card */
    .cosmos-card {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 22px;
      padding: 26px 20px 22px;
      margin-bottom: 14px;
    }
    /* Streak badge */
    #streak-badge {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(255,100,0,0.85);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 10;
      animation: pulse 2s infinite;
      display: none;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,100,0,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255,100,0,0); }
    }
    /* Input screen */
    .app-title {
      text-align: center;
      margin-bottom: 6px;
    }
    .app-title h1 { font-size: 1.7rem; letter-spacing: 1px; }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.65;
      margin-bottom: 22px;
    }
    .input-label {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 12px;
      text-align: center;
    }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .date-row select {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.30);
      color: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      text-align: center;
    }
    .date-row select option { background: #302b63; color: #fff; }
    .date-row span { font-size: 1rem; opacity: 0.8; }
    .sel-year { width: 90px; }
    .sel-month { width: 68px; }
    .sel-day { width: 62px; }
    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 10px;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn-sm {
      display: inline-block;
      width: auto;
      padding: 10px 18px;
      font-size: 0.9rem;
      margin: 4px;
      border-radius: 20px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
    }
    /* Fortune screen */
    .identity-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .identity-item {
      text-align: center;
    }
    .identity-symbol {
      font-size: 2.2rem;
      line-height: 1.1;
    }
    .identity-name {
      font-size: 0.75rem;
      opacity: 0.75;
      margin-top: 2px;
    }
    .lifepath-box {
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 0.85rem;
      align-self: center;
    }
    .lifepath-num { font-size: 1.4rem; font-weight: 800; }
    /* Fortune level */
    .fortune-level-wrap {
      text-align: center;
      margin: 8px 0 18px;
    }
    .fortune-day-label {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-bottom: 6px;
    }
    .fortune-level-text {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .fortune-emoji { font-size: 1.4rem; margin-top: 4px; }
    @keyframes popIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    /* Category stars */
    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .cat-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .cat-label { font-size: 0.78rem; opacity: 0.7; margin-bottom: 4px; }
    .cat-stars { font-size: 1.1rem; letter-spacing: 1px; color: #ffd700; }
    /* Lucky info */
    .lucky-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .lucky-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }
    .lucky-icon { font-size: 1.3rem; margin-bottom: 4px; }
    .lucky-label { font-size: 0.65rem; opacity: 0.6; margin-bottom: 3px; }
    .lucky-value { font-size: 0.82rem; font-weight: 700; line-height: 1.2; }
    .lucky-color-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 4px;
    }
    /* Cosmo message */
    .cosmo-msg {
      background: rgba(102,126,234,0.2);
      border: 1px solid rgba(102,126,234,0.4);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .cosmo-header { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
    .cosmo-text { font-size: 0.95rem; line-height: 1.55; }
    /* Tomorrow hint */
    .tomorrow-hint {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.55;
      margin-bottom: 16px;
      padding: 8px;
    }
    /* History */
    .history-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .history-row::-webkit-scrollbar { display: none; }
    .hist-card {
      flex: 0 0 72px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      font-size: 0.7rem;
    }
    .hist-emoji { font-size: 1.2rem; }
    .hist-date { opacity: 0.6; margin-top: 2px; }
    .hist-level { font-weight: 700; margin-top: 2px; font-size: 0.65rem; }
    /* Compat screen */
    .compat-zodiacs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      font-size: 1rem;
    }
    .compat-zodiac-box { text-align: center; }
    .compat-zodiac-sym { font-size: 2.8rem; }
    .compat-zodiac-name { font-size: 0.78rem; opacity: 0.75; }
    .compat-heart { font-size: 2rem; animation: heartbeat 1.2s infinite; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .compat-score-wrap { text-align: center; margin: 10px 0; }
    .compat-score-num { font-size: 4rem; font-weight: 900; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .compat-type {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }
    .compat-msg {
      font-size: 0.9rem;
      line-height: 1.55;
      opacity: 0.85;
      text-align: center;
      margin-bottom: 14px;
    }
    .compat-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .compat-detail-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      font-size: 0.75rem;
    }
    .compat-detail-label { opacity: 0.65; margin-bottom: 4px; }
    .compat-detail-val { font-weight: 700; font-size: 0.9rem; }
    /* Milestone toast */
    #milestone-toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    #milestone-toast.show { opacity: 1; }
    /* Section title */
    .section-title {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 10px;
      text-align: center;
    }
    h2 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
    .back-link { color: rgba(255,255,255,0.6) !important; }
  </style>
</head>

</div>

    const d = new Date(Date.now() + 86400000);
    const tomorrowNum = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    return tomorrowNum * 100000 + birthYear * 10 + month * 100 + day;
  }

  function getFortuneLevel(seed) {
    const r = seededRandom(seed);
    if (r < 0.10) return 0;
    if (r < 0.30) return 1;
    if (r < 0.55) return 2;
    if (r < 0.75) return 3;
    if (r < 0.88) return 4;
    if (r < 0.96) return 5;
    return 6;
  }

  function getCategoryStars(seed, offset) {
    return Math.floor(seededRandom(seed + offset) * 5) + 1;
  }

  function starsHTML(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function getCompatibility(y1, m1, d1, y2, m2, d2) {
    const zi1 = getZodiac(m1, d1), zi2 = getZodiac(m2, d2);
    const e1 = ZODIACS[zi1].element, e2 = ZODIACS[zi2].element;
    const elementScore = {
      fire_fire:80, fire_earth:60, fire_air:85, fire_water:55,
      earth_earth:80, earth_air:60, earth_water:85,
      air_air:80, air_water:65, water_water:80,
    };
    const key = [e1, e2].sort().join('_');
    const base = elementScore[key] !== undefined ? elementScore[key] : 65;
    const lp1 = getLifePathNumber(y1, m1, d1);
    const lp2 = getLifePathNumber(y2, m2, d2);
    const adj = ((lp1 + lp2) % 7) * 3 - 9;
    const eto1 = getEtoIndex(y1), eto2 = getEtoIndex(y2);
    const etoAdj = (Math.abs(eto1 - eto2) % 4 === 0) ? 5 : 0;
    return Math.min(100, Math.max(30, base + adj + etoAdj));
  }

  function getCompatType(score) {
    for (const ct of COMPAT_TYPES) {
      if (score >= ct.min) return ct;
    }
    return COMPAT_TYPES[COMPAT_TYPES.length - 1];
  }

  // ── STREAK ────────────────────────────────────────────────────────────────

  function dateStr(d) {
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }

  function updateStreak() {
    const today = dateStr(new Date());
    const yesterday = dateStr(new Date(Date.now() - 86400000));
    try {
      const data = JSON.parse(localStorage.getItem('bf_streak') || '{}');
      if (data.lastDate === today) return { streak: data.streak || 1, best: data.bestStreak || 1, isNew: false };
      data.streak = (data.lastDate === yesterday) ? (data.streak || 0) + 1 : 1;
      data.bestStreak = Math.max(data.streak, data.bestStreak || 0);
      data.lastDate = today;
      localStorage.setItem('bf_streak', JSON.stringify(data));
      return { streak: data.streak, best: data.bestStreak, isNew: true };
    } catch (e) { return { streak: 1, best: 1, isNew: false }; }
  }

  function milestoneMsg(streak) {
    if (streak === 30) return '🌟コスモ博士公認マスター！30日達成！';
    if (streak === 14) return '👑2週間連続！もはや占い博士！';
    if (streak === 7)  return '🎉1週間達成！すごすぎる！';
    if (streak === 3)  return '🔥3日連続！調子いい！';
    return null;
  }

  // ── HISTORY ───────────────────────────────────────────────────────────────

  function saveHistory(level, zodiacName, etoName) {
    try {
      const today = dateStr(new Date());
      let hist = JSON.parse(localStorage.getItem('bf_history') || '[]');
      hist = hist.filter(h => h.date !== today);
      hist.unshift({ date: today, level, zodiacName, etoName });
      if (hist.length > 7) hist = hist.slice(0, 7);
      localStorage.setItem('bf_history', JSON.stringify(hist));
    } catch (e) {}
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem('bf_history') || '[]'); }
    catch (e) { return []; }
  }

  // ── BIRTHDAY STORAGE ──────────────────────────────────────────────────────

  function saveBirthday(y, m, d) {
    try { localStorage.setItem('bf_birthday', `${y}-${m}-${d}`); } catch (e) {}
  }

  function getSavedBirthday() {
    try {
      const v = localStorage.getItem('bf_birthday');
      if (!v) return null;
      const parts = v.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return null;
      return { year: parts[0], month: parts[1], day: parts[2] };
    } catch (e) { return null; }
  }

  // ── SHARE ─────────────────────────────────────────────────────────────────

  function shareFortuneToLine(zodiacName, etoName, levelLabel, color, item, y, m, d) {
    const fmt = (n, len) => String(n).padStart(len, '0');
    const pageUrl = location.href.split('?')[0] + `?bd=${y}-${fmt(m,2)}-${fmt(d,2)}`;
    const msg = `🔮 誕生日占い (${zodiacName}・${etoName}年) 🔮\n今日の運勢：${levelLabel}\n🌈ラッキーカラー：${color}\n✨ラッキーアイテム：${item}\n\nあなたも占ってみてね👇\n${pageUrl}`;
    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(msg), '_blank');
  }

  function shareCompatToLine(z1, z2, score, type, y1, m1, d1, y2, m2, d2) {
    const fmt = (n, len) => String(n).padStart(len, '0');
    const pageUrl = location.href.split('?')[0] + `?bd=${y1}-${fmt(m1,2)}-${fmt(d1,2)}&friend=${y2}-${fmt(m2,2)}-${fmt(d2,2)}`;
    const msg = `💕 相性占い結果 💕\n${z1} × ${z2}\n相性度：${score}%！${type}\n\nふたりの相性を確かめよう👇\n${pageUrl}`;
    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(msg), '_blank');
  }

  // ── STARS BACKGROUND ──────────────────────────────────────────────────────

  function createStars() {
    const bg = document.getElementById('stars-bg');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1.5;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${(Math.random()*2+1.5).toFixed(1)}s;--delay:${(Math.random()*3).toFixed(1)}s;`;
      bg.appendChild(s);
    }
  }

  // ── SCREEN MANAGEMENT ─────────────────────────────────────────────────────

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  // ── SELECT POPULATION ─────────────────────────────────────────────────────

  function populateYear(sel) {
    const now = new Date().getFullYear();
    for (let y = now - 3; y >= now - 80; y--) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y + '年';
      sel.appendChild(o);
    }
    sel.value = now - 12;
  }

  function populateMonth(sel) {
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m + '月';
      sel.appendChild(o);
    }
  }

  function populateDay(sel, year, month) {
    const cur = +sel.value;
    sel.innerHTML = '';
    const max = daysInMonth(+year, +month);
    for (let d = 1; d <= max; d++) {
      const o = document.createElement('option');
      o.value = d; o.textContent = d + '日';
      sel.appendChild(o);
    }
    sel.value = Math.min(cur || 1, max);
  }

  function setupDateSelects(yearSel, monthSel, daySel) {
    populateYear(yearSel);
    populateMonth(monthSel);
    populateDay(daySel, yearSel.value, monthSel.value);
    monthSel.addEventListener('change', () => populateDay(daySel, yearSel.value, monthSel.value));
    yearSel.addEventListener('change', () => populateDay(daySel, yearSel.value, monthSel.value));
  }

  // ── BUILD FORTUNE SCREEN ──────────────────────────────────────────────────

  function buildFortuneScreen(year, month, day) {
    const seed = getTodaySeed(year, month, day);
    const zi = getZodiac(month, day);
    const zodiac = ZODIACS[zi];
    const etoIdx = getEtoIndex(year);
    const lp = getLifePathNumber(year, month, day);
    const level = getFortuneLevel(seed);
    const fl = FORTUNE_LEVELS[level];
    const colorIdx = Math.floor(seededRandom(seed + 7) * LUCKY_COLORS.length);
    const itemIdx  = Math.floor(seededRandom(seed + 13) * LUCKY_ITEMS.length);
    const luckyNum = Math.floor(seededRandom(seed + 19) * 9) + 1;
    const msgVar   = Math.floor(seededRandom(seed + 23) * 3);
    const cosmoMsg = COSMO_MESSAGES[zi][level][msgVar];

    // Identity bar
    document.getElementById('identity-bar').innerHTML = `
      <div class="identity-item">
        <div class="identity-symbol">${zodiac.symbol}</div>
        <div class="identity-name">${zodiac.name}</div>
      </div>
      <div class="identity-item">
        <div class="identity-symbol">${ETO_EMOJI[etoIdx]}</div>
        <div class="identity-name">${ETOS[etoIdx]}年</div>
      </div>
      <div class="identity-item lifepath-box">
        <div class="identity-name">ライフパス</div>
        <div class="lifepath-num">${lp}</div>
      </div>`;

    // Date label
    const now = new Date();
    document.getElementById('fortune-date-label').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日の運勢`;

    // Fortune level
    const lt = document.getElementById('fortune-level-text');
    lt.textContent = fl.label;
    lt.style.color = fl.color;
    document.getElementById('fortune-emoji').textContent = fl.emoji;

    // Categories
    const cats = [
      { label:'🌟 総合運', offset:31 },
      { label:'❤️ 恋愛運', offset:37 },
      { label:'📚 勉強運', offset:43 },
      { label:'👫 友達運', offset:47 },
    ];
    document.getElementById('categories').innerHTML = cats.map(c =>
      `<div class="cat-item">
        <div class="cat-label">${c.label}</div>
        <div class="cat-stars">${starsHTML(getCategoryStars(seed, c.offset))}</div>
      </div>`
    ).join('');

    // Lucky grid
    const colorHex = COLOR_HEX[colorIdx];
    document.getElementById('lucky-grid').innerHTML = `
      <div class="lucky-item">
        <div class="lucky-icon">🌈</div>
        <div class="lucky-label">ラッキーカラー</div>
        <div class="lucky-value"><span class="lucky-color-dot" style="background:${colorHex}"></span>${LUCKY_COLORS[colorIdx]}</div>
      </div>
      <div class="lucky-item">
        <div class="lucky-icon">✨</div>
        <div class="lucky-label">ラッキーアイテム</div>
        <div class="lucky-value">${LUCKY_ITEMS[itemIdx]}</div>
      </div>
      <div class="lucky-item">
        <div class="lucky-icon">🔢</div>
        <div class="lucky-label">ラッキーナンバー</div>
        <div class="lucky-value" style="font-size:1.4rem;">${luckyNum}</div>
      </div>`;

    // Cosmo message
    document.getElementById('cosmo-text').textContent = cosmoMsg;

    // Tomorrow hint
    const tomorrowLevel = getFortuneLevel(getTomorrowSeed(year, month, day));
    document.getElementById('tomorrow-hint').textContent =
      `明日の運勢は… ${FORTUNE_LEVELS[tomorrowLevel].label}かも？🔮 また明日チェックしてね`;

    // History
    const hist = getHistory();
    const histCard = document.getElementById('history-card');
    if (hist.length > 0) {
      histCard.style.display = '';
      const DOW = ['日','月','火','水','木','金','土'];
      document.getElementById('history-row').innerHTML = hist.map(h => {
        const hd = new Date(h.date);
        const dow = DOW[hd.getDay()];
        const hfl = FORTUNE_LEVELS[h.level] || FORTUNE_LEVELS[2];
        return `<div class="hist-card">
          <div class="hist-emoji">${hfl.emoji.split('')[0]}</div>
          <div class="hist-date">${hd.getMonth()+1}/${hd.getDate()}(${dow})</div>
          <div class="hist-level" style="color:${hfl.color}">${hfl.label}</div>
        </div>`;
      }).join('');
    } else {
      histCard.style.display = 'none';
    }

    // Save history
    saveHistory(level, zodiac.name, ETOS[etoIdx]);

    // Streak
    const streakData = updateStreak();
    const badge = document.getElementById('streak-badge');
    const num = document.getElementById('streak-num');
    if (streakData.streak >= 2) {
      badge.style.display = '';
      num.textContent = streakData.streak;
    }
    if (streakData.isNew) {
      const msg = milestoneMsg(streakData.streak);
      if (msg) showToast(msg);
    }

    // LINE share button
    document.getElementById('btn-line-share').onclick = () =>
      shareFortuneToLine(zodiac.name, ETOS[etoIdx] + '年', fl.label, LUCKY_COLORS[colorIdx], LUCKY_ITEMS[itemIdx], year, month, day);

    showScreen('fortune');
  }

  // ── BUILD COMPAT RESULT ───────────────────────────────────────────────────

  function buildCompatResult(y1, m1, d1, y2, m2, d2) {
    const zi1 = getZodiac(m1, d1), zi2 = getZodiac(m2, d2);
    const z1 = ZODIACS[zi1], z2 = ZODIACS[zi2];
    const eto1 = ETOS[getEtoIndex(y1)], eto2 = ETOS[getEtoIndex(y2)];
    const lp1 = getLifePathNumber(y1, m1, d1), lp2 = getLifePathNumber(y2, m2, d2);
    const score = getCompatibility(y1, m1, d1, y2, m2, d2);
    const ct = getCompatType(score);

    document.getElementById('compat-zodiacs').innerHTML = `
      <div class="compat-zodiac-box">
        <div class="compat-zodiac-sym">${z1.symbol}</div>
        <div class="compat-zodiac-name">${z1.name}</div>
      </div>
      <div class="compat-heart">💕</div>
      <div class="compat-zodiac-box">
        <div class="compat-zodiac-sym">${z2.symbol}</div>
        <div class="compat-zodiac-name">${z2.name}</div>
      </div>`;

    const scoreEl = document.getElementById('compat-score-num');
    scoreEl.textContent = score;
    scoreEl.style.color = score >= 80 ? '#ffd700' : score >= 60 ? '#5ac8fa' : '#b8b8b8';

    document.getElementById('compat-type').textContent = ct.label;
    document.getElementById('compat-msg').textContent = ct.msg;

    document.getElementById('compat-detail-grid').innerHTML = `
      <div class="compat-detail-item">
        <div class="compat-detail-label">星座相性</div>
        <div class="compat-detail-val">${z1.name}<br>×<br>${z2.name}</div>
      </div>
      <div class="compat-detail-item">
        <div class="compat-detail-label">ライフパス</div>
        <div class="compat-detail-val">${lp1} × ${lp2}</div>
      </div>
      <div class="compat-detail-item">
        <div class="compat-detail-label">干支</div>
        <div class="compat-detail-val">${eto1}${ETO_EMOJI[getEtoIndex(y1)]}<br>×<br>${eto2}${ETO_EMOJI[getEtoIndex(y2)]}</div>
      </div>`;

    document.getElementById('btn-line-share-compat').onclick = () =>
      shareCompatToLine(z1.name, z2.name, score, ct.label, y1, m1, d1, y2, m2, d2);

    showScreen('compat-result');
  }

  // ── TOAST ─────────────────────────────────────────────────────────────────

  function showToast(msg) {
    const t = document.getElementById('milestone-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ── INIT ──────────────────────────────────────────────────────────────────

  function init() {
    createStars();

    // Setup input selects
    setupDateSelects(
      document.getElementById('in-year'),
      document.getElementById('in-month'),
      document.getElementById('in-day')
    );
    setupDateSelects(
      document.getElementById('fr-year'),
      document.getElementById('fr-month'),
      document.getElementById('fr-day')
    );

    // URL params
    const params = new URLSearchParams(location.search);
    const bdParam = params.get('bd');
    const friendParam = params.get('friend');

    if (bdParam) {
      const parts = bdParam.split('-').map(Number);
      if (parts.length === 3 && parts.every(n => !isNaN(n))) {
        saveBirthday(parts[0], parts[1], parts[2]);
      }
    }

    const saved = getSavedBirthday();

    if (saved && friendParam) {
      const fp = friendParam.split('-').map(Number);
      if (fp.length === 3 && fp.every(n => !isNaN(n))) {
        buildCompatResult(saved.year, saved.month, saved.day, fp[0], fp[1], fp[2]);
        return;
      }
    }

    if (saved) {
      // Pre-fill input selects with saved values
      const ySel = document.getElementById('in-year');
      if (ySel) { ySel.value = saved.year; }
      buildFortuneScreen(saved.year, saved.month, saved.day);
    } else {
      showScreen('input');
    }

    // Event listeners
    document.getElementById('btn-start').addEventListener('click', () => {
      const y = +document.getElementById('in-year').value;
      const m = +document.getElementById('in-month').value;
      const d = +document.getElementById('in-day').value;
      saveBirthday(y, m, d);
      buildFortuneScreen(y, m, d);
    });

    document.getElementById('btn-change-bd').addEventListener('click', () => {
      try { localStorage.removeItem('bf_birthday'); } catch (e) {}
      showScreen('input');
    });

    document.getElementById('btn-go-compat').addEventListener('click', () => {
      showScreen('compat-input');
    });

    document.getElementById('btn-back-from-compat').addEventListener('click', () => {
      const s = getSavedBirthday();
      if (s) buildFortuneScreen(s.year, s.month, s.day);
      else showScreen('fortune');
    });

    document.getElementById('btn-calc-compat').addEventListener('click', () => {
      const s = getSavedBirthday();
      if (!s) { showScreen('input'); return; }
      const fy = +document.getElementById('fr-year').value;
      const fm = +document.getElementById('fr-month').value;
      const fd = +document.getElementById('fr-day').value;
      buildCompatResult(s.year, s.month, s.day, fy, fm, fd);
    });

    document.getElementById('btn-back-compat').addEventListener('click', () => {
      showScreen('compat-input');
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
