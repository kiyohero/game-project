<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誕生日占い | コスモ博士の星の共鳴理論</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }
    #stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 2s) infinite alternate;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      from { opacity: 0.15; transform: scale(1); }
      to { opacity: 0.9; transform: scale(1.4); }
    }
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 40px;
      min-height: 100vh;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .cosmos-card {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 22px;
      padding: 22px 18px 20px;
      margin-bottom: 14px;
    }
    #streak-badge {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(255,100,0,0.85);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 10;
      animation: pulse 2s infinite;
      display: none;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,100,0,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255,100,0,0); }
    }
    /* Input screen */
    .app-title { text-align: center; margin-bottom: 6px; }
    .app-title h1 { font-size: 1.7rem; letter-spacing: 1px; }
    .subtitle { text-align: center; font-size: 0.8rem; opacity: 0.65; margin-bottom: 20px; }
    .input-label { font-size: 0.95rem; opacity: 0.85; margin-bottom: 12px; text-align: center; }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .date-row input[type="number"] {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.30);
      color: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 1rem;
      outline: none;
      text-align: center;
      -moz-appearance: textfield;
      -webkit-appearance: none;
      appearance: textfield;
    }
    .date-row input[type="number"]::-webkit-inner-spin-button,
    .date-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .date-row input[type="number"]::placeholder { opacity: 0.5; font-size: 0.78rem; }
    .date-row span { font-size: 1rem; opacity: 0.8; }
    .num-year { width: 90px; }
    .num-month { width: 62px; }
    .num-day { width: 62px; }
    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 10px;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn-sm {
      display: inline-block;
      width: auto;
      padding: 10px 18px;
      font-size: 0.9rem;
      margin: 4px;
      border-radius: 20px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
    }
    /* Identity bar */
    .identity-bar {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .identity-item { text-align: center; }
    .identity-symbol { font-size: 2.2rem; line-height: 1.1; }
    .identity-name { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }
    .lifepath-box {
      background: rgba(167,139,250,0.2);
      border: 1px solid rgba(167,139,250,0.4);
      border-radius: 14px;
      padding: 8px 14px;
      align-self: center;
      min-width: 110px;
    }
    .lifepath-num { font-size: 1.6rem; font-weight: 900; color: #a78bfa; }
    .lifepath-type { font-size: 0.8rem; font-weight: 700; color: #c4b5fd; margin-top: 2px; }
    .lifepath-desc { font-size: 0.65rem; opacity: 0.65; line-height: 1.3; margin-top: 2px; }
    /* Today's keyword */
    .today-keyword {
      text-align: center;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 14px;
    }
    .keyword-label { font-size: 0.68rem; letter-spacing: 2px; opacity: 0.7; margin-bottom: 6px; }
    .keyword-word { font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; color: #fde68a; }
    /* Fortune level */
    .fortune-level-wrap { text-align: center; margin: 6px 0 16px; }
    .fortune-day-label { font-size: 0.78rem; opacity: 0.6; margin-bottom: 6px; }
    .fortune-level-text {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .fortune-emoji { font-size: 1.4rem; margin-top: 4px; }
    @keyframes popIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    /* Categories */
    .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .cat-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .cat-label { font-size: 0.78rem; opacity: 0.7; margin-bottom: 3px; }
    .cat-stars { font-size: 1.05rem; letter-spacing: 1px; color: #ffd700; }
    .cat-comment { font-size: 0.72rem; opacity: 0.75; margin-top: 3px; }
    /* Lucky info */
    .lucky-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .lucky-item { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .lucky-icon { font-size: 1.3rem; margin-bottom: 4px; }
    .lucky-label { font-size: 0.65rem; opacity: 0.6; margin-bottom: 3px; }
    .lucky-value { font-size: 0.82rem; font-weight: 700; line-height: 1.2; }
    .lucky-color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }
    /* Cosmo message */
    .cosmo-msg {
      background: rgba(102,126,234,0.2);
      border: 1px solid rgba(102,126,234,0.4);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .cosmo-header { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
    .cosmo-text { font-size: 0.95rem; line-height: 1.6; }
    .cosmo-divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 12px 0; }
    .cosmo-advice-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
    .cosmo-advice { font-size: 0.9rem; line-height: 1.6; color: #c4b5fd; }
    /* 7-day forecast */
    .forecast-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .forecast-row::-webkit-scrollbar { display: none; }
    .forecast-card {
      flex: 0 0 60px;
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      font-size: 0.7rem;
      border: 1px solid transparent;
    }
    .forecast-card.today {
      background: rgba(167,139,250,0.2);
      border-color: rgba(167,139,250,0.5);
    }
    .fc-dow { font-size: 0.72rem; font-weight: 700; margin-bottom: 2px; }
    .fc-date { font-size: 0.65rem; opacity: 0.6; margin-bottom: 4px; }
    .fc-emoji { font-size: 1.1rem; margin-bottom: 3px; }
    .fc-level { font-size: 0.65rem; font-weight: 700; }
    /* Compat screens */
    .compat-zodiacs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
    }
    .compat-zodiac-box { text-align: center; }
    .compat-zodiac-sym { font-size: 2.8rem; }
    .compat-zodiac-name { font-size: 0.78rem; opacity: 0.75; }
    .compat-zodiac-sub { font-size: 0.65rem; opacity: 0.55; margin-top: 2px; }
    .compat-heart { font-size: 2rem; animation: heartbeat 1.2s infinite; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .compat-score-wrap { text-align: center; margin: 8px 0; }
    .compat-score-num { font-size: 4rem; font-weight: 900; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .compat-type { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
    /* Element story */
    .element-story {
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .element-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
    .element-desc { font-size: 0.85rem; line-height: 1.6; opacity: 0.85; }
    /* Compat story */
    .compat-story-box {
      background: rgba(102,126,234,0.2);
      border: 1px solid rgba(102,126,234,0.35);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .compat-story-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
    .compat-story-text { font-size: 0.9rem; line-height: 1.65; }
    /* Compat detail categories */
    .compat-cats { margin-bottom: 12px; }
    .compat-cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .compat-cat-label { font-size: 0.8rem; width: 70px; flex-shrink: 0; }
    .compat-cat-stars { font-size: 0.95rem; color: #ffd700; flex-shrink: 0; }
    .compat-cat-comment { font-size: 0.75rem; opacity: 0.75; flex: 1; text-align: right; }
    /* Compat tips */
    .compat-tip-box {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .compat-tip-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
    .compat-tip-text { font-size: 0.9rem; line-height: 1.6; color: #fde68a; }
    /* Cosmo number compat */
    .cosmo-num-compat {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .cnc-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 8px; }
    .cnc-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
    .cnc-item { text-align: center; }
    .cnc-num { font-size: 1.6rem; font-weight: 900; color: #a78bfa; }
    .cnc-type { font-size: 0.75rem; color: #c4b5fd; }
    .cnc-cross { font-size: 1.2rem; opacity: 0.6; }
    .cnc-desc { font-size: 0.82rem; line-height: 1.5; opacity: 0.8; text-align: center; }
    /* Section title */
    .section-title { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; text-align: center; }
    h2 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
    #milestone-toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    #milestone-toast.show { opacity: 1; }
    .back-link { color: rgba(255,255,255,0.6) !important; }
    /* Pair daily fortune */
    .pair-daily {
      background: rgba(255,107,157,0.12);
      border: 1px solid rgba(255,107,157,0.3);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-align: center;
    }
    .pair-daily-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 8px; }
    .pair-fortune-level { font-size: 2rem; font-weight: 900; margin-bottom: 4px; }
    .pair-fortune-emoji { font-size: 1.3rem; margin-bottom: 10px; }
    .pair-lucky-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
    .pair-lucky-item { font-size: 0.82rem; }
    .pair-msg { font-size: 0.88rem; line-height: 1.65; color: #fce7f3; }
  </style>
</head>
<body>
<div id="stars-bg"></div>
<div id="streak-badge">🔥 <span id="streak-num">1</span>日連続！</div>
<div id="milestone-toast"></div>

<div class="wrapper">

  <!-- Screen 1: 生年月日入力 -->
  <div id="screen-input" class="screen active">
    <div class="cosmos-card">
      <div class="app-title"><h1>🔮 誕生日占い</h1></div>
      <p class="subtitle">コスモ博士の星の共鳴理論</p>
      <p class="input-label">生年月日を教えてね✨</p>
      <div class="date-row">
        <input type="number" id="in-year" class="num-year" placeholder="例:2010">
        <span>年</span>
        <input type="number" id="in-month" class="num-month" placeholder="月" min="1" max="12">
        <span>月</span>
        <input type="number" id="in-day" class="num-day" placeholder="日" min="1" max="31">
        <span>日</span>
      </div>
      <p id="in-error" style="color:#ff6b9d;font-size:0.8rem;text-align:center;display:none;margin-top:-12px;margin-bottom:8px;"></p>
      <button class="btn" id="btn-start">今日の運勢を見る🌟</button>
    </div>
    <p style="text-align:center;font-size:0.72rem;opacity:0.45;margin-top:8px;">入力した生年月日はこの端末のみに保存されます</p>
  </div>

  <!-- Screen 2: 今日の運勢 -->
  <div id="screen-fortune" class="screen">
    <div class="cosmos-card">
      <p class="section-title">✦ コスモ博士の鑑定結果 ✦</p>
      <div class="identity-bar" id="identity-bar"></div>
      <div class="today-keyword" id="today-keyword"></div>
      <div class="fortune-level-wrap">
        <p class="fortune-day-label" id="fortune-date-label"></p>
        <div class="fortune-level-text" id="fortune-level-text"></div>
        <div class="fortune-emoji" id="fortune-emoji"></div>
      </div>
      <div class="categories" id="categories"></div>
      <div class="lucky-grid" id="lucky-grid"></div>
      <div class="cosmo-msg">
        <p class="cosmo-header">💬 コスモ博士からのメッセージ</p>
        <p class="cosmo-text" id="cosmo-text"></p>
        <hr class="cosmo-divider">
        <p class="cosmo-advice-label">✨ 今日のアドバイス</p>
        <p class="cosmo-advice" id="cosmo-advice"></p>
      </div>
    </div>
    <div class="cosmos-card">
      <p class="section-title">📅 今週の運勢予報</p>
      <div class="forecast-row" id="forecast-row"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-sm" id="btn-go-compat">💕 相性占い</button>
      <button class="btn btn-sm" id="btn-line-share">📲 LINEでシェア</button>
      <button class="btn btn-sm btn-ghost" id="btn-change-bd">🔄 生年月日を変える</button>
      <a href="../index.html" class="btn btn-sm btn-ghost">🏠 ゲーム一覧</a>
    </div>
  </div>

  <!-- Screen 3: 相性入力 -->
  <div id="screen-compat-input" class="screen">
    <div class="cosmos-card">
      <h2>💕 相性占い</h2>
      <p class="subtitle">友達の生年月日を入れてね</p>
      <div class="date-row">
        <input type="number" id="fr-year" class="num-year" placeholder="例:2010">
        <span>年</span>
        <input type="number" id="fr-month" class="num-month" placeholder="月" min="1" max="12">
        <span>月</span>
        <input type="number" id="fr-day" class="num-day" placeholder="日" min="1" max="31">
        <span>日</span>
      </div>
      <p id="fr-error" style="color:#ff6b9d;font-size:0.8rem;text-align:center;display:none;margin-top:-12px;margin-bottom:8px;"></p>
      <button class="btn" id="btn-calc-compat">相性を見る💫</button>
      <button class="btn btn-ghost" id="btn-back-from-compat">← もどる</button>
    </div>
  </div>

  <!-- Screen 4: 相性結果 -->
  <div id="screen-compat-result" class="screen">
    <div class="cosmos-card">
      <h2>💕 ふたりの相性</h2>
      <div class="compat-zodiacs" id="compat-zodiacs"></div>
      <div class="compat-score-wrap">
        <div class="compat-score-num" id="compat-score-num"></div>
        <div style="font-size:1rem;opacity:0.7;">%</div>
      </div>
      <div class="compat-type" id="compat-type"></div>
      <div class="element-story" id="element-story"></div>
      <div class="compat-story-box">
        <p class="compat-story-label">💬 ふたりのストーリー</p>
        <p class="compat-story-text" id="compat-story-text"></p>
      </div>
      <p class="section-title" style="margin-top:4px;">📊 相性の詳細</p>
      <div class="compat-cats" id="compat-cats"></div>
      <div class="compat-tip-box" id="compat-tip-box"></div>
      <div class="cosmo-num-compat" id="cosmo-num-compat"></div>
      <div class="pair-daily" id="pair-daily-section"></div>
      <div class="btn-row">
        <button class="btn btn-sm" id="btn-line-share-compat">📲 友達にシェア</button>
        <button class="btn btn-sm btn-ghost" id="btn-back-compat">← もどる</button>
        <a href="../index.html" class="btn btn-sm btn-ghost">🏠 ゲーム一覧</a>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── DATA ──────────────────────────────────────────────────────────────────

  const ZODIACS = [
    { name:'山羊座', symbol:'♑', element:'earth', start:[12,22], end:[1,19] },
    { name:'水瓶座', symbol:'♒', element:'air',   start:[1,20],  end:[2,18] },
    { name:'魚座',   symbol:'♓', element:'water', start:[2,19],  end:[3,20] },
    { name:'牡羊座', symbol:'♈', element:'fire',  start:[3,21],  end:[4,19] },
    { name:'牡牛座', symbol:'♉', element:'earth', start:[4,20],  end:[5,20] },
    { name:'双子座', symbol:'♊', element:'air',   start:[5,21],  end:[6,21] },
    { name:'蟹座',   symbol:'♋', element:'water', start:[6,22],  end:[7,22] },
    { name:'獅子座', symbol:'♌', element:'fire',  start:[7,23],  end:[8,22] },
    { name:'乙女座', symbol:'♍', element:'earth', start:[8,23],  end:[9,22] },
    { name:'天秤座', symbol:'♎', element:'air',   start:[9,23],  end:[10,23] },
    { name:'蠍座',   symbol:'♏', element:'water', start:[10,24], end:[11,21] },
    { name:'射手座', symbol:'♐', element:'fire',  start:[11,22], end:[12,21] },
  ];

  const ETOS      = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const ETO_EMOJI = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐵','🐔','🐕','🐗'];

  const FORTUNE_LEVELS = [
    { label:'大大吉', color:'#ffd700', emoji:'🌟🌟🌟' },
    { label:'大吉',   color:'#ff9500', emoji:'⭐⭐⭐'  },
    { label:'吉',     color:'#4cd964', emoji:'✨✨'    },
    { label:'中吉',   color:'#5ac8fa', emoji:'💫💫'   },

    { label:'末吉',   color:'#b8b8b8', emoji:'🌙'     },
    { label:'凶',     color:'#ff3b30', emoji:'⚡'     },
  ];

  function getZodiacIdx(month, day) {
    for (let i = 0; i < ZODIACS.length; i++) {
      const z = ZODIACS[i];
      const [sm, sd] = z.start, [em, ed] = z.end;
      if (sm <= em) {
        if ((month === sm && day >= sd) || (month === em && day <= ed) || (month > sm && month < em)) return i;
      } else {
        if ((month === sm && day >= sd) || (month === em && day <= ed) || month > sm || month < em) return i;
      }
    }
    return 0;
  }

  function getEtoIndex(year) {
    return ((year - 4) % 12 + 12) % 12;
  }

  function getLifePathNumber(year, month, day) {
    let sum = [...`${year}${month}${day}`].reduce((a, c) => a + +c, 0);
    while (sum > 9) sum = [...`${sum}`].reduce((a, c) => a + +c, 0);
    return sum;
  }

  function seededRandom(seed) {
    const x = Math.sin(Math.abs(seed) + 1) * 10000;
    return x - Math.floor(x);
  }

  function makeSeed(year, month, day, dateOffset = 0) {
    const d = new Date();
    d.setDate(d.getDate() + dateOffset);
    const todayNum = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    return todayNum * 100000 + year * 10 + month * 100 + day;
  }

    const r = seededRandom(seed);
    if (r < 0.10) return 0;
    if (r < 0.30) return 1;
    if (r < 0.55) return 2;
    if (r < 0.75) return 3;
    if (r < 0.88) return 4;
    if (r < 0.96) return 5;
    return 6;

    };
    const key = [e1, e2].sort().join('_');
    const base = elementScore[key] !== undefined ? elementScore[key] : 65;
    const lp1 = getLifePathNumber(y1, m1, d1);
    const lp2 = getLifePathNumber(y2, m2, d2);
    const adj = ((lp1 + lp2) % 7) * 3 - 9;
    const eto1 = getEtoIndex(y1), eto2 = getEtoIndex(y2);
    const etoAdj = (Math.abs(eto1 - eto2) % 4 === 0) ? 5 : 0;
    return Math.min(100, Math.max(30, base + adj + etoAdj));
  }

  // ── STREAK ────────────────────────────────────────────────────────────────

  function dateStr(d) {
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }

  function updateStreak() {
    const today = dateStr(new Date());
    const yesterday = dateStr(new Date(Date.now() - 86400000));
    try {
      const data = JSON.parse(localStorage.getItem('bf_streak') || '{}');
      if (data.lastDate === today) return { streak: data.streak || 1, isNew: false };
      data.streak = (data.lastDate === yesterday) ? (data.streak || 0) + 1 : 1;
      data.bestStreak = Math.max(data.streak, data.bestStreak || 0);
      data.lastDate = today;
      localStorage.setItem('bf_streak', JSON.stringify(data));
      return { streak: data.streak, isNew: true };
    } catch (e) { return { streak: 1, isNew: false }; }
  }

  function milestoneMsg(streak) {
    if (streak === 30) return '🌟コスモ博士公認マスター！30日達成！';
    if (streak === 14) return '👑2週間連続！もはや占い博士！';
    if (streak === 7)  return '🎉1週間達成！すごすぎる！';
    if (streak === 3)  return '🔥3日連続！調子いい！';
    return null;
  }

  function showToast(msg) {
    const t = document.getElementById('milestone-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ── BIRTHDAY STORAGE ──────────────────────────────────────────────────────

  function saveBirthday(y, m, d) {
    try { localStorage.setItem('bf_birthday', `${y}-${m}-${d}`); } catch (e) {}
  }

  function getSavedBirthday() {
    try {
      const v = localStorage.getItem('bf_birthday');
      if (!v) return null;
      const parts = v.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return null;
      return { year: parts[0], month: parts[1], day: parts[2] };
    } catch (e) { return null; }
  }

  // ── SHARE ─────────────────────────────────────────────────────────────────

  function fmt2(n) { return String(n).padStart(2, '0'); }

  function shareFortuneToLine(zodiacName, etoName, levelLabel, color, item, y, m, d) {
    const pageUrl = location.href.split('?')[0] + `?bd=${y}-${fmt2(m)}-${fmt2(d)}`;
    const msg = `🔮 誕生日占い (${zodiacName}・${etoName}年) 🔮\n今日の運勢：${levelLabel}\n🌈ラッキーカラー：${color}\n✨ラッキーアイテム：${item}\n\nあなたも占ってみてね👇\n${pageUrl}`;
    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(msg), '_blank');
  }

  function shareCompatToLine(z1, z2, score, type, y1, m1, d1, y2, m2, d2) {
    const pageUrl = location.href.split('?')[0] + `?bd=${y1}-${fmt2(m1)}-${fmt2(d1)}&friend=${y2}-${fmt2(m2)}-${fmt2(d2)}`;
    const msg = `💕 相性占い結果 💕\n${z1} × ${z2}\n相性度：${score}%！${type}\n\nふたりの相性を確かめよう👇\n${pageUrl}`;
    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(msg), '_blank');
  }

  // ── STARS BG ──────────────────────────────────────────────────────────────

  function createStars() {
    const bg = document.getElementById('stars-bg');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1.5;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${(Math.random()*2+1.5).toFixed(1)}s;--delay:${(Math.random()*3).toFixed(1)}s;`;
      bg.appendChild(s);
    }
  }

  // ── SCREEN MANAGEMENT ─────────────────────────────────────────────────────

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  // ── PAIR DAILY FORTUNE ────────────────────────────────────────────────────

  function buildCompatDailySection(y1, m1, d1, y2, m2, d2) {
    const cseed = getCompatSeed(y1, m1, d1, y2, m2, d2);
    const now = new Date();
    const todayNum = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    const dailySeed = Math.abs((cseed * 31 + todayNum) % 999983);
    const lvl = getFortuneLevel(dailySeed);
    const fl = FORTUNE_LEVELS[lvl];
    const itemIdx = Math.floor(seededRandom(dailySeed + 7) * LUCKY_ITEMS.length);
    const colorIdx = Math.floor(seededRandom(dailySeed + 11) * LUCKY_COLORS.length);
    document.getElementById('pair-daily-section').innerHTML = `
      <p class="pair-daily-label">📅 今日のふたりの運勢</p>
      <div class="pair-fortune-level" style="color:${fl.color}">${fl.label}</div>
      <div class="pair-fortune-emoji">${fl.emoji}</div>
      <div class="pair-lucky-row">
        <div class="pair-lucky-item">🌈 <strong>${LUCKY_COLORS[colorIdx]}</strong></div>
        <div class="pair-lucky-item">✨ <strong>${LUCKY_ITEMS[itemIdx]}</strong></div>
      </div>
      <p class="pair-msg">${PAIR_MESSAGES[lvl]}</p>`;
  }

  // ── BUILD FORECAST ─────────────────────────────────────────────────────────

  function buildForecast(year, month, day) {
    const DOW = ['日','月','火','水','木','金','土'];
    const row = document.getElementById('forecast-row');
    row.innerHTML = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const s = makeSeed(year, month, day, i);
      const lvl = getFortuneLevel(s);
      const fl = FORTUNE_LEVELS[lvl];
      const card = document.createElement('div');
      card.className = 'forecast-card' + (i === 0 ? ' today' : '');
      const dowLabel = i === 0 ? '今日' : DOW[d.getDay()];
      const emoji = fl.emoji.charAt(0) + (fl.emoji.charCodeAt(0) > 0xFFFF ? fl.emoji.charAt(1) : '');
      card.innerHTML = `<div class="fc-dow">${dowLabel}</div><div class="fc-date">${d.getMonth()+1}/${d.getDate()}</div><div class="fc-emoji">${fl.emoji.split(/(?<=[\s\S])/u)[0]}</div><div class="fc-level" style="color:${fl.color}">${fl.label}</div>`;
      row.appendChild(card);
    }
  }

  // ── BUILD FORTUNE SCREEN ──────────────────────────────────────────────────

  function buildFortuneScreen(year, month, day) {
    const seed = makeSeed(year, month, day);
    const zi = getZodiacIdx(month, day);
    const zodiac = ZODIACS[zi];
    const etoIdx = getEtoIndex(year);
    const lp = getLifePathNumber(year, month, day);
    const lpData = LP_PERSONALITY[lp] || LP_PERSONALITY[9];
    const level = getFortuneLevel(seed);
    const fl = FORTUNE_LEVELS[level];
    const colorIdx = Math.floor(seededRandom(seed + 7) * LUCKY_COLORS.length);
    const itemIdx  = Math.floor(seededRandom(seed + 13) * LUCKY_ITEMS.length);
    const luckyNum = Math.floor(seededRandom(seed + 19) * 9) + 1;
    const msgVar   = Math.floor(seededRandom(seed + 23) * 3);
    const keyword  = KEYWORDS[zi][level];
    const advice   = ADVICE[zi][level];
    const cosmoMsg = COSMO_MESSAGES[zi][level][msgVar];

    // Identity bar
    document.getElementById('identity-bar').innerHTML = `
      <div class="identity-item">
        <div class="identity-symbol">${zodiac.symbol}</div>
        <div class="identity-name">${zodiac.name}</div>
      </div>
      <div class="identity-item">
        <div class="identity-symbol">${ETO_EMOJI[etoIdx]}</div>
        <div class="identity-name">${ETOS[etoIdx]}年</div>
      </div>
      <div class="identity-item lifepath-box">
        <div class="identity-name">ライフパスナンバー</div>
        <div class="lifepath-num">${lp}</div>
        <div class="lifepath-type">${lpData.type}</div>
        <div class="lifepath-desc">${lpData.desc}</div>
      </div>`;

    // Keyword
    document.getElementById('today-keyword').innerHTML = `
      <div class="keyword-label">✦ 今日のキーワード ✦</div>
      <div class="keyword-word">「${keyword}」</div>`;

    // Date label
    const now = new Date();
    document.getElementById('fortune-date-label').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日の運勢`;

    // Fortune level
    const lt = document.getElementById('fortune-level-text');
    lt.textContent = fl.label;
    lt.style.color = fl.color;
    document.getElementById('fortune-emoji').textContent = fl.emoji;

    // Categories
    const catDefs = [
      { label:'🌟 総合運', offset:31, key:'overall' },
      { label:'❤️ 恋愛運', offset:37, key:'love'    },
      { label:'📚 勉強運', offset:43, key:'study'   },
      { label:'👫 友達運', offset:47, key:'friend'  },
    ];
    document.getElementById('categories').innerHTML = catDefs.map(c => {
      const stars = getCategoryStars(seed, c.offset);
      const comment = CAT_COMMENTS[stars - 1][c.key];
      return `<div class="cat-item">
        <div class="cat-label">${c.label}</div>
        <div class="cat-stars">${starsHTML(stars)}</div>
        <div class="cat-comment">${comment}</div>
      </div>`;
    }).join('');

    // Lucky grid
    document.getElementById('lucky-grid').innerHTML = `
      <div class="lucky-item">
        <div class="lucky-icon">🌈</div>
        <div class="lucky-label">ラッキーカラー</div>
        <div class="lucky-value"><span class="lucky-color-dot" style="background:${COLOR_HEX[colorIdx]}"></span>${LUCKY_COLORS[colorIdx]}</div>
      </div>
      <div class="lucky-item">
        <div class="lucky-icon">✨</div>
        <div class="lucky-label">ラッキーアイテム</div>
        <div class="lucky-value">${LUCKY_ITEMS[itemIdx]}</div>
      </div>
      <div class="lucky-item">
        <div class="lucky-icon">🔢</div>
        <div class="lucky-label">ラッキーナンバー</div>
        <div class="lucky-value" style="font-size:1.4rem;">${luckyNum}</div>
      </div>`;

    // Cosmo message + advice
    document.getElementById('cosmo-text').textContent = cosmoMsg;
    document.getElementById('cosmo-advice').textContent = advice;

    // 7-day forecast
    buildForecast(year, month, day);

    // Streak
    const streakData = updateStreak();
    const badge = document.getElementById('streak-badge');
    if (streakData.streak >= 2) {
      badge.style.display = '';
      document.getElementById('streak-num').textContent = streakData.streak;
    }
    if (streakData.isNew) {
      const msg = milestoneMsg(streakData.streak);
      if (msg) showToast(msg);
    }

    // LINE share
    document.getElementById('btn-line-share').onclick = () =>
      shareFortuneToLine(zodiac.name, ETOS[etoIdx], fl.label, LUCKY_COLORS[colorIdx], LUCKY_ITEMS[itemIdx], year, month, day);

    showScreen('fortune');
  }

  // ── BUILD COMPAT RESULT ───────────────────────────────────────────────────

  function buildCompatResult(y1, m1, d1, y2, m2, d2) {
    const zi1 = getZodiacIdx(m1, d1), zi2 = getZodiacIdx(m2, d2);
    const z1 = ZODIACS[zi1], z2 = ZODIACS[zi2];
    const eto1 = ETOS[getEtoIndex(y1)], eto2 = ETOS[getEtoIndex(y2)];
    const lp1 = getLifePathNumber(y1, m1, d1), lp2 = getLifePathNumber(y2, m2, d2);
    const lpp1 = LP_PERSONALITY[lp1] || LP_PERSONALITY[9];
    const lpp2 = LP_PERSONALITY[lp2] || LP_PERSONALITY[9];
    const score = getCompatibility(y1, m1, d1, y2, m2, d2);
    const ct = COMPAT_TYPES.find(c => score >= c.min);

    // Zodiacs header
    document.getElementById('compat-zodiacs').innerHTML = `
      <div class="compat-zodiac-box">
        <div class="compat-zodiac-sym">${z1.symbol}</div>
        <div class="compat-zodiac-name">${z1.name}</div>
        <div class="compat-zodiac-sub">${ETO_EMOJI[getEtoIndex(y1)]} ${eto1}年</div>
      </div>
      <div class="compat-heart">💕</div>
      <div class="compat-zodiac-box">
        <div class="compat-zodiac-sym">${z2.symbol}</div>
        <div class="compat-zodiac-name">${z2.name}</div>
        <div class="compat-zodiac-sub">${ETO_EMOJI[getEtoIndex(y2)]} ${eto2}年</div>
      </div>`;

    const scoreEl = document.getElementById('compat-score-num');
    scoreEl.textContent = score;
    scoreEl.style.color = score >= 80 ? '#ffd700' : score >= 60 ? '#5ac8fa' : '#b8b8b8';
    document.getElementById('compat-type').textContent = ct.label;

    // Element story
    const elemKey = [z1.element, z2.element].sort().join('_');
    const story = ELEMENT_STORY[elemKey] || ELEMENT_STORY['earth_earth'];
    document.getElementById('element-story').innerHTML = `
      <div class="element-title">${story.title}</div>
      <div class="element-desc">${story.desc}</div>`;

    // Compat story (from COMPAT_TYPES message)
    document.getElementById('compat-story-text').textContent = ct.msg;

    // Detail categories
    const cseed = getCompatSeed(y1, m1, d1, y2, m2, d2);
    const catRows = [
      { label:'🤝 友情力',     stars: getCategoryStars(cseed, 51), key:'friend'  },
      { label:'🎉 盛り上がり', stars: getCategoryStars(cseed, 57), key:'fun'     },
      { label:'📖 学び合い',   stars: getCategoryStars(cseed, 63), key:'learning'},
    ];
    document.getElementById('compat-cats').innerHTML = catRows.map(r => {
      const comment = COMPAT_CAT_COMMENTS[r.stars - 1][r.key];
      return `<div class="compat-cat-row">
        <span class="compat-cat-label">${r.label}</span>
        <span class="compat-cat-stars">${starsHTML(r.stars)}</span>
        <span class="compat-cat-comment">${comment}</span>
      </div>`;
    }).join('');

    // Tip
    const tipKey = [z1.element, z2.element].sort().join('_');
    const tip = COMPAT_TIPS[tipKey] || 'お互いの良さを認め合うと、最高の友達になれるよ！';
    document.getElementById('compat-tip-box').innerHTML = `
      <p class="compat-tip-label">💡 もっと仲良くなるコツ</p>
      <p class="compat-tip-text">${tip}</p>`;

    // Cosmo number compat
    const lpRelation = getLPRelation(lp1, lp2);
    document.getElementById('cosmo-num-compat').innerHTML = `
      <p class="cnc-label">🔢 ライフパスナンバーの相性</p>
      <div class="cnc-row">
        <div class="cnc-item"><div class="cnc-num">${lp1}</div><div class="cnc-type">${lpp1.type}</div></div>
        <div class="cnc-cross">×</div>
        <div class="cnc-item"><div class="cnc-num">${lp2}</div><div class="cnc-type">${lpp2.type}</div></div>
      </div>
      <p class="cnc-desc">${lpRelation}</p>`;

    // Pair daily fortune
    buildCompatDailySection(y1, m1, d1, y2, m2, d2);

    // Share button
    document.getElementById('btn-line-share-compat').onclick = () =>
      shareCompatToLine(z1.name, z2.name, score, ct.label, y1, m1, d1, y2, m2, d2);

    showScreen('compat-result');
  }

  function getLPRelation(lp1, lp2) {
    const p1 = LP_PERSONALITY[lp1] || LP_PERSONALITY[9];
    const p2 = LP_PERSONALITY[lp2] || LP_PERSONALITY[9];
    const sum = lp1 + lp2;
    if (lp1 === lp2) return `ふたりとも「${p1.type}」！同じ宿命数が生み出す奇跡の縁だよ✨`;
    if (sum <= 6)  return `「${p1.type}」と「${p2.type}」の組み合わせ。お互いが刺激し合える最強ペア！`;
    if (sum <= 11) return `「${p1.type}」と「${p2.type}」の絶妙な組み合わせ。違う個性が補い合えるよ！`;
    return `「${p1.type}」と「${p2.type}」が出会う運命の組み合わせ。お互いの宇宙を広げ合えるよ！`;
  }

  // ── INIT ──────────────────────────────────────────────────────────────────

  function init() {
    createStars();

    const nowY = new Date().getFullYear();
    const minY = nowY - 80, maxY = nowY - 3;
    ['in-year', 'fr-year'].forEach(id => {
      const el = document.getElementById(id);
      el.min = minY; el.max = maxY;
    });

    const params = new URLSearchParams(location.search);
    const bdParam = params.get('bd');
    const friendParam = params.get('friend');
    const compatMode = params.get('compat') === '1';

    if (bdParam) {
      const parts = bdParam.split('-').map(Number);
      if (parts.length === 3 && parts.every(n => !isNaN(n))) {
        saveBirthday(parts[0], parts[1], parts[2]);
      }
    }

    const saved = getSavedBirthday();

    if (saved && friendParam) {
      const fp = friendParam.split('-').map(Number);
      if (fp.length === 3 && fp.every(n => !isNaN(n))) {
        buildCompatResult(saved.year, saved.month, saved.day, fp[0], fp[1], fp[2]);
        return;
      }
    }

    if (saved && compatMode) {
      showScreen('compat-input');
      return;
    }

    if (saved) {
      document.getElementById('in-year').value = saved.year;
      document.getElementById('in-month').value = saved.month;
      document.getElementById('in-day').value = saved.day;
      buildFortuneScreen(saved.year, saved.month, saved.day);
    } else {
      if (compatMode) window._afterInput = 'compat';
      showScreen('input');
    }

    function validateDate(yId, mId, dId, errId) {
      const y = parseInt(document.getElementById(yId).value, 10);
      const m = parseInt(document.getElementById(mId).value, 10);
      const d = parseInt(document.getElementById(dId).value, 10);
      const errEl = document.getElementById(errId);
      if (isNaN(y) || y < minY || y > maxY) {
        errEl.textContent = `年は${minY}〜${maxY}で入力してね`;
        errEl.style.display = ''; return null;
      }
      if (isNaN(m) || m < 1 || m > 12) {
        errEl.textContent = '月は1〜12で入力してね';
        errEl.style.display = ''; return null;
      }
      if (isNaN(d) || d < 1 || d > daysInMonth(y, m)) {
        errEl.textContent = `日は1〜${daysInMonth(y, m)}で入力してね`;
        errEl.style.display = ''; return null;
      }
      errEl.style.display = 'none';
      return { y, m, d };
    }

    // Event listeners
    document.getElementById('btn-start').addEventListener('click', () => {
      const v = validateDate('in-year', 'in-month', 'in-day', 'in-error');
      if (!v) return;
      saveBirthday(v.y, v.m, v.d);
      if (window._afterInput === 'compat') {
        window._afterInput = null;
        showScreen('compat-input');
      } else {
        buildFortuneScreen(v.y, v.m, v.d);
      }
    });

    document.getElementById('btn-change-bd').addEventListener('click', () => {
      try { localStorage.removeItem('bf_birthday'); } catch (e) {}
      ['in-year', 'in-month', 'in-day'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('in-error').style.display = 'none';
      showScreen('input');
    });

    document.getElementById('btn-go-compat').addEventListener('click', () => showScreen('compat-input'));

    document.getElementById('btn-back-from-compat').addEventListener('click', () => {
      const s = getSavedBirthday();
      if (s) buildFortuneScreen(s.year, s.month, s.day);
      else showScreen('fortune');
    });

    document.getElementById('btn-calc-compat').addEventListener('click', () => {
      const s = getSavedBirthday();
      if (!s) { showScreen('input'); return; }
      const v = validateDate('fr-year', 'fr-month', 'fr-day', 'fr-error');
      if (!v) return;
      buildCompatResult(s.year, s.month, s.day, v.y, v.m, v.d);
    });

    document.getElementById('btn-back-compat').addEventListener('click', () => showScreen('compat-input'));
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
