<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どうぶつ性格診断</title>
<link rel="stylesheet" href="common.css">
<script src="common.js" defer></script>
<script>window.GAME_PROJECT_CURRENT_GAME = 'どうぶつ性格診断';</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
  padding: 60px 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
}

.stars-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
}
.star-particle {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--d, 2s) ease-in-out infinite;
  animation-delay: var(--del, 0s);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.08; }
  50% { opacity: 0.65; }
}

#app {
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; align-items: center;
}

.screen { display: none; width: 100%; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(180,140,255,0.3);
  border-radius: 20px;
  padding: 28px 20px 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  width: 100%;
  margin-bottom: 16px;
}

/* Title */
.animal-parade {
  display: flex; justify-content: center; gap: 8px;
  font-size: 2rem; margin-bottom: 16px;
}
.animal-parade span {
  display: inline-block;
  animation: floatBob 2.5s ease-in-out infinite alternate;
}
.animal-parade span:nth-child(1) { animation-delay: 0s; }
.animal-parade span:nth-child(2) { animation-delay: 0.25s; }
.animal-parade span:nth-child(3) { animation-delay: 0.5s; }
.animal-parade span:nth-child(4) { animation-delay: 0.75s; }
.animal-parade span:nth-child(5) { animation-delay: 1.0s; }
@keyframes floatBob {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}

.title-main {
  font-size: 1.7rem; font-weight: 800;
  background: linear-gradient(135deg, #e0b0ff, #b080ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center; margin-bottom: 12px;
}
.title-desc {
  text-align: center; color: rgba(220,200,255,0.85);
  font-size: 0.95rem; line-height: 1.7; margin-bottom: 24px;
}
.title-desc small { font-size: 0.78rem; opacity: 0.7; }
.last-result-hint {
  text-align: center; font-size: 0.82rem; color: rgba(180,150,255,0.8);
  margin-top: 10px;
}

/* Progress */
.progress-wrap {
  background: rgba(255,255,255,0.12);
  border-radius: 8px; height: 10px;
  margin-bottom: 8px; overflow: hidden;
}
.progress-bar {
  background: linear-gradient(90deg, #9b6dff, #c44dff);
  height: 100%; border-radius: 8px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-label {
  font-size: 0.78rem; color: rgba(200,170,255,0.7);
  text-align: right; margin-bottom: 10px;
}
.dimension-badge {
  font-size: 0.8rem; color: rgba(180,150,255,0.85);
  text-align: center; margin-bottom: 16px;
  background: rgba(155,109,255,0.15);
  border-radius: 20px; padding: 5px 14px; display: inline-block;
  width: 100%;
}
.question-text {
  font-size: 1.1rem; font-weight: 700;
  color: #f0e8ff; text-align: center;
  margin-bottom: 24px; line-height: 1.6;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.btn-option {
  display: block; width: 100%; min-height: 64px;
  border: 2px solid rgba(180,140,255,0.3);
  background: rgba(255,255,255,0.06);
  color: rgba(220,200,255,0.9);
  border-radius: 14px; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; padding: 14px 16px;
  text-align: left; line-height: 1.5;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.btn-option:hover { background: rgba(180,140,255,0.18); border-color: rgba(180,140,255,0.7); }
.btn-option:active { transform: scale(0.97); }
.btn-option:disabled { opacity: 0.5; cursor: not-allowed; }

/* Analyzing */
.analyzing-wrap { text-align: center; padding: 48px 20px 40px; }
.animal-spin-container {
  font-size: 3.5rem; margin-bottom: 24px;
  display: flex; justify-content: center; gap: 12px;
}
.spin-animal {
  display: inline-block;
  animation: animalBounce 0.6s ease-in-out infinite alternate;
}
.spin-animal:nth-child(2) { animation-delay: 0.15s; }
.spin-animal:nth-child(3) { animation-delay: 0.30s; }
@keyframes animalBounce {
  from { transform: translateY(0) scale(1); }
  to   { transform: translateY(-12px) scale(1.2); }
}
.analyzing-text { font-size: 1.1rem; font-weight: 700; color: #e0d0ff; margin-bottom: 16px; }
.dot-loader { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
.dot-loader span {
  width: 10px; height: 10px; border-radius: 50%;
  background: #9b6dff;
  animation: dotPulse 1.2s ease-in-out infinite;
}
.dot-loader span:nth-child(2) { animation-delay: 0.2s; }
.dot-loader span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
.analyzing-sub { font-size: 0.85rem; color: rgba(200,170,255,0.7); }

/* Result */
.result-card {
  --accent: #9b6dff;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 2px solid var(--accent);
  border-radius: 20px; padding: 28px 20px 24px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  width: 100%; margin-bottom: 16px;
  animation: fadeIn 0.4s ease;
}
.result-animal-emoji {
  font-size: 5.5rem; display: block;
  text-align: center; margin-bottom: 8px;
  animation: animalPop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes animalPop {
  from { transform: scale(0) rotate(-15deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg); opacity: 1; }
}
.result-animal-name {
  font-size: 1.9rem; font-weight: 900;
  background: linear-gradient(135deg, #e8d0ff, #c090ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center; margin-bottom: 4px;
}
.result-tagline {
  text-align: center; font-size: 0.9rem;
  color: rgba(200,170,255,0.8); margin-bottom: 16px;
}
.result-description {
  font-size: 0.92rem; color: rgba(220,200,255,0.9);
  line-height: 1.75; margin-bottom: 16px;
}
.traits-label {
  font-size: 0.82rem; font-weight: 700;
  color: rgba(200,170,255,0.7); margin-bottom: 10px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.trait-pill {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(180,140,255,0.2);
  border-radius: 10px; padding: 9px 13px;
  font-size: 0.88rem; margin-bottom: 7px;
  color: rgba(220,200,255,0.9);
}
.trait-pill::before { content: '✦'; color: var(--accent, #9b6dff); font-size: 0.75rem; flex-shrink: 0; }

.mbti-box {
  background: rgba(155,109,255,0.12);
  border: 1px solid rgba(155,109,255,0.35);
  border-radius: 12px; padding: 12px 16px;
  margin-top: 16px;
}
.mbti-box-label { font-size: 0.72rem; color: rgba(180,150,255,0.7); margin-bottom: 4px; }
.mbti-type-code {
  font-size: 1.4rem; font-weight: 900; letter-spacing: 0.1em;
  color: #d0a8ff; margin-bottom: 4px;
}
.mbti-desc { font-size: 0.85rem; color: rgba(220,200,255,0.85); line-height: 1.55; }

.section-label {
  font-size: 0.82rem; font-weight: 700; color: rgba(200,170,255,0.7);
  margin-bottom: 12px;
}

.compat-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(180,140,255,0.25);
  border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
}
.compat-emoji { font-size: 2.8rem; flex-shrink: 0; }
.compat-label { font-size: 0.72rem; opacity: 0.6; margin-bottom: 3px; }
.compat-name  { font-size: 1rem; font-weight: 700; color: #e0d0ff; }
.compat-desc  { font-size: 0.82rem; color: rgba(220,200,255,0.8); line-height: 1.5; margin-top: 3px; }

.lucky-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lucky-item {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(180,140,255,0.2);
  border-radius: 12px; padding: 12px 10px; text-align: center;
}
.lucky-icon  { font-size: 1.5rem; margin-bottom: 4px; }
.lucky-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 4px; }
.lucky-value { font-size: 0.92rem; font-weight: 700; color: #e0d0ff; }

/* Compat check panel */
.compat-check-title { font-size: 1rem; font-weight: 700; color: #e0d0ff; margin-bottom: 6px; }
.compat-check-sub { font-size: 0.8rem; color: rgba(200,170,255,0.7); margin-bottom: 14px; line-height: 1.5; }
.compat-animals-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 14px;
}
.compat-animal-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(180,140,255,0.25);
  border-radius: 10px; padding: 8px 4px;
  font-size: 1.6rem; cursor: pointer;
  text-align: center; transition: background 0.15s, transform 0.1s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.compat-animal-btn small { font-size: 0.55rem; color: rgba(200,170,255,0.7); line-height: 1.2; }
.compat-animal-btn:hover { background: rgba(155,109,255,0.2); transform: scale(1.05); }
.compat-animal-btn.selected { background: rgba(155,109,255,0.35); border-color: #9b6dff; }
.compat-result-box {
  background: rgba(155,109,255,0.12);
  border: 1px solid rgba(155,109,255,0.3);
  border-radius: 12px; padding: 14px 16px;
  font-size: 0.9rem; color: rgba(220,200,255,0.9);
  line-height: 1.6; display: none;
  animation: fadeIn 0.3s ease;
}
.compat-result-box.visible { display: block; }

.result-anim {
  animation: slideUp 0.5s ease both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Buttons */
.btn-primary {
  display: block; width: 100%;
  background: linear-gradient(135deg, #7b4daa, #5a2d82);
  color: #fff; border: none; border-radius: 14px;
  padding: 16px; font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(123,77,170,0.5); margin-bottom: 12px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(123,77,170,0.6); }
.btn-primary:active { transform: scale(0.97); }

.btn-line {
  display: block; width: 100%;
  background: #06C755; color: #fff; border: none;
  border-radius: 14px; padding: 14px;
  font-size: 1rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 16px rgba(6,199,85,0.4); margin-bottom: 10px;
  transition: transform 0.15s;
}
.btn-line:hover { transform: translateY(-2px); }

.btn-secondary {
  display: block; width: 100%;
  background: rgba(255,255,255,0.08);
  color: rgba(220,200,255,0.9);
  border: 1px solid rgba(180,140,255,0.35);
  border-radius: 14px; padding: 13px;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
  margin-bottom: 10px; transition: background 0.2s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="stars-bg" class="stars-bg"></div>
<div id="app">

  <!-- ===== TITLE SCREEN ===== -->
  <div id="screen-title" class="screen active">
    <div class="card">
      <div class="animal-parade" aria-hidden="true">
        <span>🦁</span><span>🐬</span><span>🦛</span><span>🦈</span><span>🐧</span>
      </div>
      <div class="title-main">どうぶつ性格診断</div>
      <p class="title-desc">28のしつもんに答えると<br>あなたにそっくりな<strong>どうぶつ</strong>が分かるよ！<br><small>MBTIをもとにした本格診断</small></p>
      <button id="btn-start" class="btn-primary">🐾 診断スタート！</button>
      <p id="last-result-hint" class="last-result-hint" style="display:none"></p>
    </div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <div class="progress-wrap"><div class="progress-bar" id="quiz-progress-bar"></div></div>
      <p class="progress-label" id="quiz-progress-label">しつもん 1 / 12</p>
      <p class="dimension-badge" id="dimension-badge"></p>
      <p class="question-text" id="quiz-question"></p>
      <div class="quiz-options" id="quiz-options"></div>
    </div>
  </div>

  <!-- ===== ANALYZING SCREEN ===== -->
  <div id="screen-analyzing" class="screen">
    <div class="card analyzing-wrap">
      <div class="animal-spin-container" id="animal-spin"></div>
      <p class="analyzing-text">どうぶつを探しています…</p>
      <div class="dot-loader"><span></span><span></span><span></span></div>
      <p class="analyzing-sub" id="analyzing-sub">あなたのこたえをぶんせきちゅう</p>
    </div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="screen-result" class="screen">
    <div id="result-main-card" class="result-card"></div>
    <div id="result-compat-card" class="card result-anim" style="animation-delay:0.5s"></div>
    <div id="result-lucky-card" class="card result-anim" style="animation-delay:0.6s"></div>
    <div class="card result-anim" style="animation-delay:0.7s">
      <button id="btn-share-line" class="btn-line">💚 LINEでシェアする</button>
      <button id="btn-share-clipboard" class="btn-secondary">📋 結果をコピーする</button>
      <button id="btn-retry" class="btn-secondary">🔄 もう一度やってみる</button>
    </div>
    <div id="compat-check-panel" class="card result-anim" style="animation-delay:0.8s"></div>
  </div>

</div>

<script>
// ===== QUESTIONS (28問: 各軸7問) =====
var QUESTIONS = [
  // EI-1
  { dim:'EI', q:'がっこうの休み時間、どうしたい？',
    a:{text:'みんなとわいわい外で遊ぶ', side:'E'},
    b:{text:'ひとりでゆっくり本を読んだり考えごとをする', side:'I'},
    badge:'🤝 休み時間のすごし方' },
  // SN-1
  { dim:'SN', q:'友だちと遊びに行くなら、どっちに行きたい？',
    a:{text:'よく行くお気に入りの場所', side:'S'},
    b:{text:'まだ行ったことない新しい場所を探険する', side:'N'},
    badge:'🗺️ 遊ぶ場所えらび' },
  // TF-1
  { dim:'TF', q:'友だちが「テストで失敗してしまった」と落ち込んでいたら？',
    a:{text:'「次はここをこうすれば上がるよ」と具体的に教える', side:'T'},
    b:{text:'まずそばに座って「大丈夫？どうしたの？」と話を聞く', side:'F'},
    badge:'💬 友だちの悩みを聞くとき' },
  // JP-1
  { dim:'JP', q:'明日が遠足！荷物のじゅんびはいつする？',
    a:{text:'前の日のうちにリストを作って全部確認しておく', side:'J'},
    b:{text:'当日の朝、気分で必要なものをつめる', side:'P'},
    badge:'📅 遠足のじゅんび' },
  // EI-2
  { dim:'EI', q:'友だちの誕生日パーティーで3時間遊んだあと、どんな気持ちになる？',
    a:{text:'もっと遊びたい！まだまだ元気いっぱい', side:'E'},
    b:{text:'たのしかったけど、ひとりでゆっくりしたくなってきた', side:'I'},
    badge:'🎉 パーティーのあとで' },
  // SN-2
  { dim:'SN', q:'「もし空を飛べるとしたら？」と聞かれたら、最初に思うことは？',
    a:{text:'どんなときに便利か、どこへ行けるか考える', side:'S'},
    b:{text:'雲の上からどんな景色が見えるか想像する', side:'N'},
    badge:'💭 「もし〜だったら？」' },
  // TF-2
  { dim:'TF', q:'カードゲームで負けて悔しそうにしている友だちに声をかけるなら？',
    a:{text:'「次はこうすれば勝てると思う！戦略を教えてあげる」', side:'T'},
    b:{text:'「大丈夫！またいっしょにやろう、きっと楽しいから」', side:'F'},
    badge:'🎮 ゲームで負けた友だちへ' },
  // JP-2
  { dim:'JP', q:'急に「明日は学校が休みだよ」と言われたら？',
    a:{text:'何をするかすぐに計画を立てる', side:'J'},
    b:{text:'明日の朝、気分で決めようと思う', side:'P'},
    badge:'⏰ 自由時間のつかい方' },
  // EI-3
  { dim:'EI', q:'学芸会で役を選ぶなら、どっちがいい？',
    a:{text:'セリフがたくさんあって、みんなの前に立つ主役', side:'E'},
    b:{text:'裏方で照明や道具を担当してみんなを支える役', side:'I'},
    badge:'🎤 学芸会の役えらび' },
  // SN-3
  { dim:'SN', q:'図工の時間に「好きに作っていいよ」と言われたら？',
    a:{text:'手順書や見本を参考にしながら、ていねいに作る', side:'S'},
    b:{text:'頭に浮かんだイメージを自分流にアレンジして作る', side:'N'},
    badge:'✂️ 図工のつくり方' },
  // TF-3
  { dim:'TF', q:'班の遠足の行き先で意見がわかれたとき、あなたはどうする？',
    a:{text:'「こっちのほうが交通費が安くて時間的にも合理的だよ」と説明する', side:'T'},
    b:{text:'「みんなが一番楽しめるのはどっちかな？」と全員の気持ちを聞く', side:'F'},
    badge:'🏫 班の話し合い' },
  // JP-3
  { dim:'JP', q:'週末に宿題が5ページ出たら、どうやってやる？',
    a:{text:'土曜日に全部終わらせて、日曜日は気持ちよく遊ぶ', side:'J'},
    b:{text:'やる気が出たときにやって、残りは日曜日でもOK', side:'P'},
    badge:'📚 宿題のやり方' },
  // EI-4
  { dim:'EI', q:'土曜日の昼、何もする予定がないとき、どっちを選ぶ？',
    a:{text:'友だちに「あそぼ！」とメッセージを送る', side:'E'},
    b:{text:'家で好きなこと（本・ゲーム・絵など）をひとりで楽しむ', side:'I'},
    badge:'🏠 週末のすごし方' },
  // SN-4
  { dim:'SN', q:'図書館で本を1冊選ぶなら、どっちを読みたい？',
    a:{text:'実際にあった出来事や事実を詳しく説明している本', side:'S'},
    b:{text:'「もしこんな世界があったら？」という不思議な世界の話', side:'N'},
    badge:'📖 本えらび' },
  // TF-4
  { dim:'TF', q:'グループのルールを新しく作るとき、一番大切にしたいのは？',
    a:{text:'だれにとっても公平で、はっきりしたルールにすること', side:'T'},
    b:{text:'グループのみんなが「いいね！」と思えるルールにすること', side:'F'},
    badge:'⚖️ グループでのきめごと' },
  // JP-4
  { dim:'JP', q:'楽しみにしていた予定が急に変更になったとき、どう感じる？',
    a:{text:'がっかりする。計画がくずれるのは気持ち悪い', side:'J'},
    b:{text:'「じゃあ別のことしよう！」と新しい展開が楽しみになる', side:'P'},
    badge:'🔄 計画変更のとき' },
  // EI-5
  { dim:'EI', q:'新しいクラスになった最初の日、あなたはどうしてる？',
    a:{text:'いろんな人に自分から話しかけて、どんどん友だちを作る', side:'E'},
    b:{text:'まず周りのことをよく観察して、気が合いそうな人を見つける', side:'I'},
    badge:'🆕 新しいクラスで' },
  // SN-5

// ===== SHUFFLER =====
function buildShuffledQuestions() {
  var pools = { EI: [], SN: [], TF: [], JP: [] };
  QUESTIONS.forEach(function(q) { pools[q.dim].push(q); });
  ['EI','SN','TF','JP'].forEach(function(dim) {
    pools[dim].sort(function() { return Math.random() - 0.5; });
  });
  var result = [];
  var rounds = pools.EI.length;
  for (var r = 0; r < rounds; r++) {
    var axes = ['EI','SN','TF','JP'];
    axes.sort(function() { return Math.random() - 0.5; });
    axes.forEach(function(dim) {
      result.push({ data: pools[dim][r], flip: Math.random() < 0.5 });
    });
  }
  return result;
}

function getCompatMessage(myType, friendType) {
  if (myType === friendType) {
    var d = MBTI_ANIMALS[myType];
    return d.emoji + ' ' + d.animal + ' どうし！同じタイプのなかまだよ。気が合うことが多いけど、たまにぶつかることも……ふたりで成長していこう！';
  }
  if (OPPOSITE_PAIRS[myType] === friendType) {
    var me = MBTI_ANIMALS[myType];
    var fr = MBTI_ANIMALS[friendType];
    return me.emoji + ' と ' + fr.emoji + ' は正反対のタイプ！だからこそ引き合う最強ペアだよ。お互いに学び合えること間違いなし🌟';
  }
  var idx = (myType.charCodeAt(0) + friendType.charCodeAt(0)) % GENERIC_COMPAT.length;
  return MBTI_ANIMALS[myType].emoji + ' と ' + MBTI_ANIMALS[friendType].emoji + ' — ' + GENERIC_COMPAT[idx];
}

var state = { step: 0, scores: {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}, result: null, questions: [] };
var analyzeInterval = null;

function showScreen(name) {
  ['title','quiz','analyzing','result'].forEach(function(id) {
    var el = document.getElementById('screen-' + id);
    if (el) el.classList.toggle('active', id === name);
  });
  window.scrollTo(0, 0);
}

function renderQuestion(step) {
  var entry = state.questions[step];
  var q = entry.data;
  var total = state.questions.length;
  var pct = Math.round(step / total * 100);
  document.getElementById('quiz-progress-bar').style.width = pct + '%';
  document.getElementById('quiz-progress-label').textContent = 'しつもん ' + (step + 1) + ' / ' + total;
  document.getElementById('dimension-badge').textContent = q.badge;
  document.getElementById('quiz-question').textContent = q.q;

  var container = document.getElementById('quiz-options');
  container.innerHTML = '';
  var opts = entry.flip ? [q.b, q.a] : [q.a, q.b];
  opts.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = opt.text;
    btn.addEventListener('click', function() { handleAnswer(opt.side); });
    container.appendChild(btn);
  });
}

function handleAnswer(side) {
  document.querySelectorAll('.btn-option').forEach(function(b) { b.disabled = true; });
  state.scores[side]++;
  state.step++;
  if (state.step < state.questions.length) {
    setTimeout(function() { renderQuestion(state.step); }, 150);
  } else {
    showScreen('analyzing');
    startAnalyzingAnimation();
    setTimeout(computeResult, 2200);
  }
}

function computeResult() {
  var s = state.scores;
  var type = (s.E >= s.I ? 'E' : 'I') + (s.S >= s.N ? 'S' : 'N') + (s.T >= s.F ? 'T' : 'F') + (s.J >= s.P ? 'J' : 'P');
  state.result = type;
  saveResult(type);
  showResult(type);
}

    'あなたのこたえをぶんせきちゅう…',
    'どうぶつのデータを確認中…',
    'あなたにぴったりのどうぶつを探しています…'
  ];
  var subIdx = 0;
  container.innerHTML = '';
  var picks = [];
  while (picks.length < 3) {
    var r = PARADE[Math.floor(Math.random() * PARADE.length)];
    if (picks.indexOf(r) < 0) picks.push(r);
  }
  picks.forEach(function(em) {
    var span = document.createElement('span');
    span.className = 'spin-animal';
    span.textContent = em;
    container.appendChild(span);
  });
  analyzeInterval = setInterval(function() {
    subIdx = (subIdx + 1) % subTexts.length;
    document.getElementById('analyzing-sub').textContent = subTexts[subIdx];
    var slots = container.querySelectorAll('.spin-animal');
    var si = Math.floor(Math.random() * 3);
    var newA;
    do { newA = PARADE[Math.floor(Math.random() * PARADE.length)]; } while (newA === slots[si].textContent);
    slots[si].textContent = newA;
  }, 600);
}

function stopAnalyzing() {
  if (analyzeInterval) { clearInterval(analyzeInterval); analyzeInterval = null; }
}

function showResult(type) {
  stopAnalyzing();
  var d = MBTI_ANIMALS[type];

  var card = document.getElementById('result-main-card');
  card.style.setProperty('--accent', d.color);
  card.style.borderColor = d.color;
  card.style.boxShadow = '0 8px 40px rgba(0,0,0,0.5), 0 0 32px rgba(' + d.colorRgb + ',0.3)';

  var traitsHtml = d.traits.map(function(t, i) {
    return '<div class="trait-pill" style="animation-delay:' + (0.3 + i * 0.1) + 's">' + t + '</div>';
  }).join('');

  card.innerHTML =
    '<div style="text-align:center">' +
      '<span class="result-animal-emoji">' + d.emoji + '</span>' +
      '<div class="result-animal-name">' + d.animal + '</div>' +
      '<div class="result-tagline">' + d.tagline + '</div>' +
    '</div>' +
    '<p class="result-description">' + d.description + '</p>' +
    '<p class="traits-label">✦ あなたのとくちょう</p>' +
    traitsHtml +
    '<div class="mbti-box">' +
      '<div class="mbti-box-label">🔬 MBTIで言うなら…</div>' +
      '<div class="mbti-type-code">' + type + '</div>' +
      '<div class="mbti-desc">' + d.mbtiDesc + '</div>' +
    '</div>';

  var compatCard = document.getElementById('result-compat-card');
  compatCard.innerHTML =
    '<p class="section-label">💕 相性のいいどうぶつ</p>' +
    '<div class="compat-box">' +
      '<span class="compat-emoji">' + d.compatible.emoji + '</span>' +
      '<div>' +
        '<div class="compat-label">相性タイプ</div>' +
        '<div class="compat-name">' + d.compatible.animal + '</div>' +
        '<div class="compat-desc">' + d.compatDesc + '</div>' +
      '</div>' +
    '</div>';

  var luckyCard = document.getElementById('result-lucky-card');
  luckyCard.innerHTML =
    '<p class="section-label">🌟 あなたのラッキー</p>' +
    '<div class="lucky-grid">' +
      '<div class="lucky-item"><div class="lucky-icon">🎨</div><div class="lucky-label">ラッキーカラー</div><div class="lucky-value">' + d.lucky.color + '</div></div>' +
      '<div class="lucky-item"><div class="lucky-icon">✨</div><div class="lucky-label">ラッキーアイテム</div><div class="lucky-value">' + d.lucky.item + '</div></div>' +
    '</div>';

  buildCompatCheckPanel(type);
  showScreen('result');
}

function buildCompatCheckPanel(myType) {
  var panel = document.getElementById('compat-check-panel');
  var buttonsHtml = Object.keys(MBTI_ANIMALS).map(function(t) {
    var a = MBTI_ANIMALS[t];
    return '<button class="compat-animal-btn" data-type="' + t + '">' + a.emoji + '<small>' + a.animal + '</small></button>';
  }).join('');

  panel.innerHTML =
    '<p class="compat-check-title">💕 友だちとの相性をチェック！</p>' +
    '<p class="compat-check-sub">友だちに診断してもらったら、その子のどうぶつを選んでね</p>' +
    '<div class="compat-animals-grid">' + buttonsHtml + '</div>' +
    '<div id="compat-result-box" class="compat-result-box"></div>';

  panel.querySelectorAll('.compat-animal-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      panel.querySelectorAll('.compat-animal-btn').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      var friendType = btn.getAttribute('data-type');
      var msg = getCompatMessage(myType, friendType);
      var box = document.getElementById('compat-result-box');
      box.textContent = msg;
      box.classList.add('visible');
    });
  });
}

function shareToLine() {
  var d = MBTI_ANIMALS[state.result];
  var text = '🐾 どうぶつ性格診断やってみた！\n\n私は「' + d.animal + ' ' + d.emoji + '」だったよ！\n' + d.tagline + '\nMBTIで言うと' + state.result + 'タイプだって🌟\n\nあなたは何の動物？やってみてね👇\n' + location.href;
  window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
}

function shareToClipboard() {
  var d = MBTI_ANIMALS[state.result];
  var text = '🐾 どうぶつ性格診断\n私は「' + d.animal + ' ' + d.emoji + '」（' + state.result + 'タイプ）！\n' + d.tagline + '\n' + location.href;
  var btn = document.getElementById('btn-share-clipboard');
  var orig = btn.textContent;
  function onDone() {
    btn.textContent = '✅ コピーしました！';
    setTimeout(function() { btn.textContent = orig; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onDone).catch(fallback);
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); onDone(); } catch(e) {}
    document.body.removeChild(ta);
  }
}

function saveResult(type) {
  try {
    localStorage.setItem('mbtiAnimalResult', JSON.stringify({
      type: type,
      animal: MBTI_ANIMALS[type].animal,
      emoji: MBTI_ANIMALS[type].emoji,
      date: Date.now()
    }));
  } catch(e) {}
}

function loadLastResult() {
  try { return JSON.parse(localStorage.getItem('mbtiAnimalResult')); } catch(e) { return null; }
}

function createStarsBg() {
  var bg = document.getElementById('stars-bg');
  if (!bg) return;
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star-particle';
    var size = Math.random() * 2.5 + 1;
    s.style.cssText =
      'width:' + size + 'px;' +
      'height:' + size + 'px;' +
      'left:' + (Math.random() * 100) + '%;' +
      'top:' + (Math.random() * 100) + '%;' +
      '--d:' + (Math.random() * 2 + 1.5).toFixed(1) + 's;' +
      '--del:' + (Math.random() * 3).toFixed(1) + 's;';
    bg.appendChild(s);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  createStarsBg();

  document.getElementById('btn-start').addEventListener('click', function() {
    state.step = 0;
    state.scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    state.result = null;
    state.questions = buildShuffledQuestions();
    renderQuestion(0);
    showScreen('quiz');
  });

  document.getElementById('btn-share-line').addEventListener('click', shareToLine);
  document.getElementById('btn-share-clipboard').addEventListener('click', shareToClipboard);
  document.getElementById('btn-retry').addEventListener('click', function() {
    state.step = 0;
    state.scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    state.result = null;
    showScreen('title');
  });

  var last = loadLastResult();
  if (last) {
    var hint = document.getElementById('last-result-hint');
    hint.textContent = '前回の結果: ' + last.animal + ' ' + last.emoji + ' (' + last.type + ')';
    hint.style.display = 'block';
  }
});
</script>
