<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ブロックパズル</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js" defer></script>
  <style>
    body {
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .game-wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      background: #e8e0f0;
      border-radius: 8px;
      color: #6b5b7a;
      padding: 8px 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(107, 91, 122, 0.12);
    }

    .stat-label {
      display: block;
      font-size: 0.72rem;
      color: #9b8ab8;
      margin-bottom: 2px;
    }

    .stat-value {
      display: block;
      font-size: 1.08rem;
      font-weight: bold;
      line-height: 1.2;
      min-height: 1.3em;
    }

    .play-area {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 300px) 150px;
      justify-content: center;
      align-items: start;
      gap: 12px;
    }

    .board-panel {
      position: relative;
      width: min(300px, calc(100vw - 32px));
      aspect-ratio: 1 / 2;
      border-radius: 10px;
      padding: 8px;
      background: linear-gradient(135deg, #7a6b8a, #5f516f);
      box-shadow: 0 8px 20px rgba(80, 60, 100, 0.25);
    }

    #board {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      background: #211a2c;
      touch-action: none;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .next-box,
    .message-box {
      background: #e8e0f0;
      border-radius: 8px;
      color: #6b5b7a;
      padding: 10px;
      text-align: center;
    }

    .next-label {
      font-size: 0.82rem;
      font-weight: bold;
      color: #8b7aa0;
      margin-bottom: 6px;
    }

    #next {
      display: block;
      width: 110px;
      height: 110px;
      margin: 0 auto;
      border-radius: 8px;
      background: #f8f3ff;
    }

    .message-box {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.86rem;
      line-height: 1.5;
      font-weight: bold;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn,
    .mobile-btn {
      border: none;
      border-radius: 8px;
      background: #7a6b8a;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(107, 91, 122, 0.18);
      transition: transform 0.1s, background 0.15s;
    }

    .action-btn {
      padding: 9px 16px;
      font-size: 0.92rem;
    }

    .action-btn:hover,
    .mobile-btn:hover {
      background: #6b5b7a;
    }

    .action-btn:active,
    .mobile-btn:active {
      transform: scale(0.95);
    }

    .how-to-play {
      margin-bottom: 0;
      max-width: 560px;
    }

    .mobile-controls {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      max-width: 480px;
      padding-bottom: env(safe-area-inset-bottom);
      touch-action: none;
    }

    .mobile-btn {
      min-height: 48px;
      font-size: 1.1rem;
      padding: 8px 4px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .mobile-btn.drop {
      font-size: 0.9rem;
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
        padding-bottom: calc(72px + env(safe-area-inset-bottom));
      }

      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .game-wrap {
        gap: 6px;
        max-width: 390px;
      }

      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        order: -2;
      }

      .stat {
        border-radius: 7px;
        padding: 5px 3px;
      }

      .stat-label {
        font-size: 0.62rem;
        margin-bottom: 0;
      }

      .stat-value {
        font-size: 0.88rem;
        min-height: 1.15em;
      }

      .play-area {
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        gap: 6px;
      }

      .board-panel {
        width: min(61vw, 232px);
        max-height: calc(100dvh - 370px);
        padding: 7px;
        grid-row: 2;
      }

      .side-panel {
        width: min(100%, 330px);
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        align-items: stretch;
        gap: 6px;
        grid-row: 1;
      }

      #next {
        width: 54px;
        height: 54px;
      }

      .next-box,
      .message-box {
        padding: 6px;
      }

      .next-label {
        font-size: 0.7rem;
        margin-bottom: 2px;
      }

      .message-box {
        min-height: 66px;
        font-size: 0.72rem;
        line-height: 1.4;
      }

      .actions {
        align-self: stretch;
        justify-content: flex-end;
        gap: 6px;
        order: -1;
      }

      .action-btn {
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.76rem;
        box-shadow: none;
      }

      .how-to-play {
        margin-top: 2px;
      }

      .mobile-controls {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 130;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-areas: "left down rotate drop right";
        gap: 7px;
        max-width: 360px;
        margin: 0 auto;
        padding: 8px;
        border-radius: 14px;
        background: rgba(245, 240, 250, 0.94);
        box-shadow: 0 -6px 20px rgba(80, 60, 100, 0.16);
        backdrop-filter: blur(8px);
      }

      .mobile-btn {
        min-height: 48px;
        font-size: 1rem;
      }

      .mobile-btn[data-action="left"] { grid-area: left; }
      .mobile-btn[data-action="rotate"] { grid-area: rotate; }
      .mobile-btn[data-action="right"] { grid-area: right; }
      .mobile-btn[data-action="down"] { grid-area: down; }
      .mobile-btn[data-action="drop"] { grid-area: drop; }

      .mobile-btn[data-action="rotate"] {
        background: #8b5fbf;
        font-size: 1.05rem;
      }

      .mobile-btn.drop {
        background: #5f516f;
        font-size: 0.92rem;
      }
    }

    @media (max-width: 360px) {
      .board-panel {
        width: min(60vw, 216px);
        padding: 6px;
      }

      .mobile-btn {
        min-height: 42px;
        font-size: 0.95rem;
      }

      .mobile-btn.drop {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <h1>ブロックパズル</h1>

  <main class="game-wrap">
    <section class="stats" aria-label="スコア">
      <div class="stat"><span class="stat-label">スコア</span><span id="score" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">ベスト</span><span id="best" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">ライン</span><span id="lines" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">レベル</span><span id="level" class="stat-value">1</span></div>
    </section>

    <section class="play-area" aria-label="ゲームエリア">
      <div class="board-panel">
        <canvas id="board" width="300" height="600" aria-label="10列20行のブロックパズル盤面"></canvas>
      </div>

      <aside class="side-panel">
        <div class="next-box">
          <div class="next-label">つぎ</div>
          <canvas id="next" width="110" height="110" aria-label="次のブロック"></canvas>
        </div>
        <div id="message" class="message-box" aria-live="polite">ブロックを横にそろえて消そう！</div>
      </aside>
    </section>

    <div class="actions">
      <button id="retryBtn" class="action-btn" type="button">リトライ</button>
      <button id="pauseBtn" class="action-btn" type="button">一時停止</button>
    </div>

    <details class="how-to-play">
      <summary>あそびかた</summary>
      <ul>
        <li>落ちてくるブロックを動かして、横一列をすき間なくそろえると消えます。</li>
        <li>うすく見えるブロックは、いまのブロックが落ちる場所の目印です。</li>
        <li>キーボードは、左右で移動、上・Z・Enterで回転、下で少し速く落とします。</li>
        <li>Spaceで一気に落とし、Pで一時停止できます。</li>
      </ul>
    </details>

    <section class="mobile-controls" aria-label="スマホ操作">
      <button class="mobile-btn" type="button" data-action="left" aria-label="左へ移動">←</button>
      <button class="mobile-btn" type="button" data-action="rotate" aria-label="回転">回転</button>
      <button class="mobile-btn" type="button" data-action="right" aria-label="右へ移動">→</button>
      <button class="mobile-btn" type="button" data-action="down" aria-label="下へ移動">下</button>
      <button class="mobile-btn drop" type="button" data-action="drop" aria-label="一気に落とす">落とす</button>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const COLS = 10;
      const ROWS = 20;
      const CELL = 30;
      const BEST_KEY = 'block-puzzle-best';
      const COLORS = {
        I: '#5ec8e5',
        J: '#6a8df5',
        L: '#f2a64b',
        O: '#f3d34a',
        S: '#70c96b',
        T: '#b77bea',
        Z: '#ef6f79'
      };
      const SHAPES = {
        I: [[0, 1], [1, 1], [2, 1], [3, 1]],
        J: [[0, 0], [0, 1], [1, 1], [2, 1]],
        L: [[2, 0], [0, 1], [1, 1], [2, 1]],
        O: [[1, 0], [2, 0], [1, 1], [2, 1]],
        S: [[1, 0], [2, 0], [0, 1], [1, 1]],
        T: [[1, 0], [0, 1], [1, 1], [2, 1]],
        Z: [[0, 0], [1, 0], [1, 1], [2, 1]]
      };
      const TYPES = Object.keys(SHAPES);

      const boardCanvas = document.getElementById('board');
      const boardCtx = boardCanvas.getContext('2d');
      const nextCanvas = document.getElementById('next');
      const nextCtx = nextCanvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const linesEl = document.getElementById('lines');
      const levelEl = document.getElementById('level');
      const messageEl = document.getElementById('message');
      const pauseBtn = document.getElementById('pauseBtn');

      let board;
      let current;
      let nextType;
      let score;
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      let lines;
      let level;
      let dropTimer;
      let lastTime;
      let paused;
      let gameOver;
      let audioCtx;
      let soundReady = false;
      let holdDelayId = null;
      let holdRepeatId = null;
      const REPEATABLE_ACTIONS = new Set(['left', 'right', 'down']);

      function makeBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      }

      function randomType() {
        return TYPES[Math.floor(Math.random() * TYPES.length)];
      }

      function makePiece(type) {
        return {
          type,
          cells: SHAPES[type].map(([x, y]) => ({ x, y })),
          x: 3,
          y: 0
        };
      }

      function formatNumber(value) {
        return value.toLocaleString('ja-JP');
      }

      function updateStats() {
        scoreEl.textContent = formatNumber(score);
        bestEl.textContent = formatNumber(best);
        linesEl.textContent = formatNumber(lines);
        levelEl.textContent = String(level);
      }

      function cellPositions(piece, offsetX = 0, offsetY = 0, cells = piece.cells) {
        return cells.map(cell => ({
          x: piece.x + cell.x + offsetX,
          y: piece.y + cell.y + offsetY
        }));
      }

      function collides(piece, offsetX = 0, offsetY = 0, cells = piece.cells) {
        return cellPositions(piece, offsetX, offsetY, cells).some(({ x, y }) => {
          return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && board[y][x]);
        });
      }

      function drawCell(ctx, x, y, size, color, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
        ctx.fillRect(x * size + 3, y * size + 3, size - 6, Math.max(3, size * 0.18));
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.strokeRect(x * size + 1.5, y * size + 1.5, size - 3, size - 3);
        ctx.restore();
      }

      function drawGrid() {
        boardCtx.fillStyle = '#211a2c';
        boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardCtx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
        boardCtx.lineWidth = 1;
        for (let x = 1; x < COLS; x++) {
          boardCtx.beginPath();
          boardCtx.moveTo(x * CELL + 0.5, 0);
          boardCtx.lineTo(x * CELL + 0.5, boardCanvas.height);
          boardCtx.stroke();
        }
        for (let y = 1; y < ROWS; y++) {
          boardCtx.beginPath();
          boardCtx.moveTo(0, y * CELL + 0.5);
          boardCtx.lineTo(boardCanvas.width, y * CELL + 0.5);
          boardCtx.stroke();
        }
      }

      function getGhostPiece() {
        const ghost = {
          type: current.type,
          cells: current.cells,
          x: current.x,
          y: current.y
        };
        while (!collides(ghost, 0, 1)) {
          ghost.y += 1;
        }
        return ghost;
      }

      function drawBoard() {
        drawGrid();
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (board[y][x]) {
              drawCell(boardCtx, x, y, CELL, COLORS[board[y][x]]);
            }
          }
        }

        if (current) {
          const ghost = getGhostPiece();
          cellPositions(ghost).forEach(({ x, y }) => {
            if (y >= 0) {
              drawCell(boardCtx, x, y, CELL, COLORS[current.type], 0.22);
            }
          });
          cellPositions(current).forEach(({ x, y }) => {
            if (y >= 0) {
              drawCell(boardCtx, x, y, CELL, COLORS[current.type]);
            }
          });
        }

        if (paused || gameOver) {
          boardCtx.fillStyle = 'rgba(33, 26, 44, 0.72)';
          boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
          boardCtx.fillStyle = '#fff';
          boardCtx.font = 'bold 26px sans-serif';
          boardCtx.textAlign = 'center';
          boardCtx.textBaseline = 'middle';
          boardCtx.fillText(gameOver ? 'ゲームおわり' : '一時停止', boardCanvas.width / 2, boardCanvas.height / 2);
        }
      }

      function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        nextCtx.fillStyle = '#f8f3ff';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        const cells = SHAPES[nextType];
        const minX = Math.min(...cells.map(cell => cell[0]));
        const maxX = Math.max(...cells.map(cell => cell[0]));
        const minY = Math.min(...cells.map(cell => cell[1]));
        const maxY = Math.max(...cells.map(cell => cell[1]));
        const size = 22;
        const offsetX = (nextCanvas.width - (maxX - minX + 1) * size) / 2;
        const offsetY = (nextCanvas.height - (maxY - minY + 1) * size) / 2;
        cells.forEach(([x, y]) => {
          nextCtx.save();
          nextCtx.translate(offsetX, offsetY);
          drawCell(nextCtx, x - minX, y - minY, size, COLORS[nextType]);
          nextCtx.restore();
        });
      }

      function rotateCells(cells) {
        return cells.map(({ x, y }) => ({ x: 3 - y, y: x }));
      }

      function rotatePiece() {
        if (!current || paused || gameOver) return;
        if (current.type === 'O') {
          playSound('rotate');
          return;
        }
        const rotated = rotateCells(current.cells);
        const kicks = [0, -1, 1, -2, 2];
        const kick = kicks.find(dx => !collides(current, dx, 0, rotated));
        if (kick !== undefined) {
          current.cells = rotated;
          current.x += kick;
          playSound('rotate');
          drawBoard();
        }
      }

      function move(dx) {
        if (!current || paused || gameOver) return false;
        if (!collides(current, dx, 0)) {
          current.x += dx;
          playSound('move');
          drawBoard();
          return true;
        }
        return false;
      }

      function softDrop() {
        if (!current || paused || gameOver) return false;
        if (!collides(current, 0, 1)) {
          current.y += 1;
          score += 1;
          playSound('move');
          updateStats();
          drawBoard();
          return true;
        }
        lockPiece();
        return false;
      }

      function hardDrop() {
        if (!current || paused || gameOver) return;
        let distance = 0;
        while (!collides(current, 0, 1)) {
          current.y += 1;
          distance += 1;
        }
        score += distance * 2;
        playSound('drop');
        lockPiece();
      }

      function lockPiece() {
        cellPositions(current).forEach(({ x, y }) => {
          if (y >= 0) {
            board[y][x] = current.type;
          }
        });
        clearLines();
        spawnPiece();
        updateStats();
        drawBoard();
      }

      function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (board[y].every(Boolean)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(null));
            cleared += 1;
            y += 1;
          }
        }
        if (cleared > 0) {
          const points = [0, 100, 300, 500, 800][cleared] * level;
          score += points;
          lines += cleared;
          level = 1 + Math.floor(lines / 8);
          messageEl.textContent = cleared === 4 ? 'すごい！4ライン同時クリア！' : `${cleared}ライン消えたよ！`;
          playSound('clear');
        }
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
        }
      }

      function spawnPiece() {
        current = makePiece(nextType);
        nextType = randomType();
        drawNext();
        if (collides(current)) {
          endGame();
        }
      }

      function endGame() {
        gameOver = true;
        paused = false;
        pauseBtn.textContent = '一時停止';
        messageEl.textContent = 'リトライで、もう一度あそべるよ。';
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
        }
        playSound('over');
        updateStats();
      }

      function dropInterval() {
        return Math.max(360, 920 - (level - 1) * 55);
      }

      function loop(time = 0) {
        if (!lastTime) {
          lastTime = time;
        }
        const delta = time - lastTime;
        lastTime = time;
        if (!paused && !gameOver) {
          dropTimer += delta;
          if (dropTimer >= dropInterval()) {
            dropTimer = 0;
            if (!collides(current, 0, 1)) {
              current.y += 1;
            } else {
              lockPiece();
            }
            drawBoard();
          }
        }
        requestAnimationFrame(loop);
      }

      function togglePause() {
        if (gameOver) return;
        paused = !paused;
        pauseBtn.textContent = paused ? '再開' : '一時停止';
        messageEl.textContent = paused ? 'Pキーか再開ボタンでつづきから！' : 'ブロックを横にそろえて消そう！';
        playSound(paused ? 'pause' : 'move');
        drawBoard();
      }

      function resetGame() {
        board = makeBoard();
        score = 0;
        lines = 0;
        level = 1;
        dropTimer = 0;
        lastTime = 0;
        paused = false;
        gameOver = false;
        nextType = randomType();
        pauseBtn.textContent = '一時停止';
        messageEl.textContent = 'ブロックを横にそろえて消そう！';
        spawnPiece();
        updateStats();
        drawBoard();
      }

      function unlockSound() {
        soundReady = true;
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(kind) {
        if (!soundReady || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const settings = {
          move: [360, 0.035, 0.035],
          rotate: [520, 0.04, 0.04],
          drop: [180, 0.08, 0.06],
          clear: [760, 0.12, 0.08],
          pause: [300, 0.06, 0.04],
          over: [130, 0.16, 0.07]
        }[kind] || [420, 0.04, 0.04];
        osc.type = kind === 'clear' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(settings[0], now);
        if (kind === 'clear') {
          osc.frequency.exponentialRampToValueAtTime(980, now + settings[1]);
        }
        gain.gain.setValueAtTime(settings[2], now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + settings[1]);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + settings[1]);
      }

      function handleAction(action) {
        unlockSound();
        if (action === 'left') move(-1);
        if (action === 'right') move(1);
        if (action === 'rotate') rotatePiece();
        if (action === 'down') softDrop();
        if (action === 'drop') hardDrop();
      }

      function stopHoldAction() {
        clearTimeout(holdDelayId);
        clearInterval(holdRepeatId);
        holdDelayId = null;
        holdRepeatId = null;
      }

      function startHoldAction(action) {
        stopHoldAction();
        if (!REPEATABLE_ACTIONS.has(action)) return;
        holdDelayId = setTimeout(() => {
          holdRepeatId = setInterval(() => {
            handleAction(action);
          }, action === 'down' ? 70 : 95);
        }, 180);
      }

      document.addEventListener('keydown', event => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'].includes(event.key)) {
          event.preventDefault();
        }
        unlockSound();
        if (event.key === 'ArrowLeft') move(-1);
        if (event.key === 'ArrowRight') move(1);
        if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'z' || event.key === 'Enter') rotatePiece();
        if (event.key === 'ArrowDown') softDrop();
        if (event.key === ' ') hardDrop();
        if (event.key.toLowerCase() === 'p') togglePause();
      });

      document.getElementById('retryBtn').addEventListener('click', () => {
        unlockSound();
        resetGame();
        playSound('move');
      });
      pauseBtn.addEventListener('click', () => {
        unlockSound();
        togglePause();
      });
      document.querySelectorAll('.mobile-btn').forEach(button => {
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          const action = button.dataset.action;
          button.setPointerCapture?.(event.pointerId);
          handleAction(action);
          startHoldAction(action);
        });
        button.addEventListener('pointerup', stopHoldAction);
        button.addEventListener('pointercancel', stopHoldAction);
        button.addEventListener('pointerleave', stopHoldAction);
        button.addEventListener('lostpointercapture', stopHoldAction);
      });

      bestEl.textContent = formatNumber(best);
      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
