<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲーム</title>
  <script src="games/games-data.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f0fa; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px 10px; }
    h1 { font-size: 1.6rem; color: #6b5b7a; margin-bottom: 12px; }
    .shelf { width: 100%; max-width: 400px; margin-bottom: 8px; }
    .shelf-title { font-size: 1rem; font-weight: bold; color: #6b5b7a; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
    .game-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
    .game-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #a78bbd, #8b6fa8);
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s;
      box-shadow: 0 2px 8px rgba(107, 91, 122, 0.25);
    }
    .game-card:hover { transform: scale(1.05); }
    .game-card:active { transform: scale(0.95); }
    .game-icon { font-size: 2.2rem; line-height: 1; }
    .game-card span:last-child { color: #fff; font-size: 0.78rem; font-weight: 600; text-align: center; padding: 0 4px; line-height: 1.2; }
  </style>
</head>
<body>
  <h1>ゲーム</h1>
  <div id="shelves"></div>
  <script>
    // ゲーム棚を生成（さいきん あそんだ ＋ カテゴリ別）
    document.addEventListener('DOMContentLoaded', function() {
      const games = window.GAME_PROJECT_GAMES;
      const categories = window.GAME_PROJECT_CATEGORIES;
      const shelves = document.getElementById('shelves');
      if (!Array.isArray(games) || !Array.isArray(categories) || !shelves) return;

      // 履歴を読む
      let history = {};
      try {
        history = JSON.parse(localStorage.getItem('gameHistory') || '{}');
      } catch (e) {}

      // カード生成（共通）
      function makeCard(game) {
        const a = document.createElement('a');
        a.href = 'games/' + game.file;
        a.className = 'game-card';
        const icon = document.createElement('span');
        icon.className = 'game-icon';
        icon.textContent = game.icon;
        const label = document.createElement('span');
        label.textContent = game.name;
        a.appendChild(icon);
        a.appendChild(label);
        return a;
      }

      // 棚生成（共通）
      function makeShelf(titleText, list) {
        const shelf = document.createElement('div');
        shelf.className = 'shelf';
        const title = document.createElement('div');
        title.className = 'shelf-title';
        title.textContent = titleText;
        const grid = document.createElement('div');
        grid.className = 'game-list';
        list.forEach(function(g) { grid.appendChild(makeCard(g)); });
        shelf.appendChild(title);
        shelf.appendChild(grid);
        return shelf;
      }

      // しんちゃく（新しく追加されたゲーム。games-data.js の isNew: true が対象）
      const news = games.filter(function(g) { return g.isNew; });
      if (news.length) {
        shelves.appendChild(makeShelf('🆕 しんちゃく', news));
      }

      // さいきん あそんだ（履歴キーは file の ? 以降を除いた純粋なファイル名）
      const recent = games
        .filter(function(g) { return history[g.file.split('?')[0]]; })
        .sort(function(a, b) {
          return history[b.file.split('?')[0]] - history[a.file.split('?')[0]];
        })
        .slice(0, 6);
      if (recent.length) {
        shelves.appendChild(makeShelf('🕘 さいきん あそんだ', recent));
      }

      // カテゴリ棚
      categories.forEach(function(cat) {
        const catGames = games.filter(function(g) { return g.category === cat.id; });
        if (!catGames.length) return;
        shelves.appendChild(makeShelf(cat.icon + ' ' + cat.name, catGames));
      });
    });
  </script>
</body>
</html>
